<style>
/* ─── Variables ─────────────────────────────────────────── */
/* ┌────────────────────────────────────────────────────────┐
   │  要改介面文字 → 找 JS 裡的 STR = { zh:{ … }, en:{ … } }│
   └────────────────────────────────────────────────────────┘ */
:root {
  --bg:        #0a0a0c;
  --surface:   #131317;
  --card:      #1c1c21;
  --card2:     #161619;
  --accent:    #f5f5f5;
  --on-accent: #111111;
  --accent-h:  #d4d4d4;
  --acc-dim:   rgba(255,255,255,.10);
  --purple:    #9aa0a6;
  --text:      #f2f3f5;
  --muted:     #9ba1ad;
  --border:    #303036;
  --inp:       #0b0b0d;
  --ok:        #e6e6e6;
  --radius:    10px;
}
:root{ color-scheme: light dark; }   /* 見 <head> 的說明 */

[data-theme="light"] {
  --bg:        #f4f4f5;
  --surface:   #ffffff;
  --card:      #ececee;
  --card2:     #f7f7f8;
  --accent:    #1a1a1a;
  --on-accent: #ffffff;
  --accent-h:  #000000;
  --acc-dim:   rgba(0,0,0,.07);
  --purple:    #555b61;
  --text:      #141416;
  --muted:     #6e727a;
  --border:    #d6d6da;
  --inp:       #ffffff;
  --ok:        #2a2a2a;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Segoe UI','Microsoft JhengHei UI',system-ui,sans-serif;
  font-size:14px;
  background:var(--bg); color:var(--text);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ─── Header ──────────────────────────────────────────────── */
header {
  height:52px; flex-shrink:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:0 18px; display:flex; align-items:center; gap:12px;
}
.logo { font-size:15px; font-weight:700; color:var(--accent); white-space:nowrap; }
.logo em { color:var(--text); font-style:normal; font-weight:400; }
.brand { display:inline-block; padding:1px 6px; border-radius:5px; border:1px solid transparent; transition:background .25s,color .25s,border-color .25s; }
body.is-conn .brand { color:#fff; background:#c81e2a; border-color:#c81e2a; }
.status-pill {
  display:flex; align-items:center; gap:5px;
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:3px 10px; font-size:12px; color:var(--muted);
}
/* LED inside connect button */
.led { width:8px; height:8px; border-radius:50%; background:#e5484d; box-shadow:0 0 5px rgba(229,72,77,.7); flex-shrink:0; transition:background .3s,box-shadow .3s; }
.led.ok  { background:#22c55e; box-shadow:0 0 6px #22c55e; animation:led-pulse 2s ease-in-out infinite; }
.led.err { background:#e5484d; }
@keyframes led-pulse { 0%,100%{box-shadow:0 0 4px #22c55e} 50%{box-shadow:0 0 10px #22c55e} }
.hdr-r { margin-left:auto; display:flex; gap:7px; align-items:center; }

/* ─── Buttons ─────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 13px; border-radius:8px;
  border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:13px; font-family:inherit;
  cursor:pointer; transition:border-color .14s,background .14s;
  white-space:nowrap; line-height:1;
}
.btn:hover:not(:disabled) { border-color:var(--accent); background:var(--acc-dim); }
.btn:disabled { opacity:.4; cursor:default; }
.btn-p { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn-p:hover:not(:disabled) { background:var(--accent-h); border-color:var(--accent-h); }
.btn-sm { padding:4px 9px; font-size:12px; border-radius:6px; }
.btn-icon { padding:6px 8px; font-size:15px; line-height:1; border-radius:8px; }

/* ─── Layout ──────────────────────────────────────────────── */
.layout { flex:1; display:flex; overflow:hidden; }

/* ─── Sidebar ─────────────────────────────────────────────── */
.sidebar {
  width:210px; flex-shrink:0;
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:14px 11px; gap:9px;
}
.sb-label {
  font-size:11px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); padding:0 4px;
}
.dev-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; }
.dev-item {
  padding:9px 11px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); cursor:pointer;
  transition:border-color .14s,background .14s;
}
.dev-item:hover { border-color:var(--accent); }
/* ★ 目前選中的裝置用綠色。原本用紅色，但紅色在這個 UI 裡代表
 * 「未連線／斷線」，會讓人誤以為裝置掉了 —— 綠色才與「已連線」一致。 */
.dev-item.active {
  border-color:#1faa55;
  background:rgba(31,170,85,.13);
  box-shadow:inset 3px 0 0 #1faa55;
}
.dev-item.active .dev-name { color:#1faa55; font-weight:700; }
.dev-item.active .kb-icon  { color:#1faa55; }
/* ② 掃描中／灌入中的指示 */
.dev-busy{
  display:flex; align-items:center; gap:7px;
  margin-top:9px; padding:7px 9px; font-size:12px; color:var(--muted);
  background:var(--card2); border:1px dashed var(--border); border-radius:8px;
}
.spin{
  width:12px; height:12px; flex:0 0 12px;
  border:2px solid var(--border); border-top-color:#1faa55;
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.dev-item.writing{ border-color:#1faa55; }
.dev-prog{ font-size:11px; color:#1faa55; margin-top:3px; }
.dev-empty{ font-size:11px; color:var(--muted); margin-top:3px; font-style:italic; }
    /* 到上限的「＋」按鈕：保持可按（按了才有提示），但樣式變暗；
       旁邊直接寫出原因，不必等 tooltip。 */
    .add-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; max-width:190px; }
    .add-circle.at-limit{ opacity:.4; border-style:dashed; cursor:not-allowed; }
    .add-circle.at-limit:hover{ opacity:.7; border-color:#c81e2a; color:#c81e2a; background:transparent; }
    .add-why{
      font-size:11px; line-height:1.55; color:var(--muted); text-align:center;
      padding:5px 8px; border-radius:6px; background:var(--inp);
      border:1px solid var(--border);
    }

    /* 容量計量（放在套用按鈕左側） */
    .cap-meter{
      margin-right:auto; padding:4px 9px; border-radius:6px;
      font-size:12px; font-family:ui-monospace,Consolas,monospace;
      color:var(--muted); background:var(--inp); border:1px solid var(--border);
      cursor:help;
    }
    .cap-over{ color:#e0313f; border-color:rgba(200,30,42,.45); background:rgba(200,30,42,.08); }

    /* 套用失敗的逐包記錄（只在失敗後出現） */
    .dev-log{
      margin-top:8px; padding:8px 10px; font-size:11.5px; line-height:1.7;
      color:var(--muted); background:var(--inp);
      border:1px solid var(--border); border-radius:8px;
      font-family:ui-monospace,Consolas,monospace; max-width:760px;
      white-space:pre-wrap; word-break:break-all;
    }

    /* 清單上的移除按鈕：平常很淡，滑到那一列才明顯 —— 不要讓它搶走注意力，
       但也不能藏到找不到（那就等於沒有出口）。 */
    .dev-item{ position:relative; }
    .dev-rm{
      position:absolute; top:6px; right:6px;
      width:22px; height:22px; line-height:1; padding:0;
      border:1px solid transparent; border-radius:6px;
      background:transparent; color:var(--muted);
      font-size:15px; cursor:pointer; opacity:0; transition:opacity .12s;
    }
    .dev-item:hover .dev-rm{ opacity:.75; }
    .dev-rm:hover{ opacity:1; color:#e0313f; border-color:rgba(200,30,42,.45);
                   background:rgba(200,30,42,.10); }

    /* 掃描／診斷記錄：預設收起，只佔一行；點開才展開完整內容。
       放在側邊欄掃描按鈕下方，收起時不會把按鈕推走。 */
    .scan-log{ margin-top:10px; font-size:11px; color:var(--muted); }
    .scan-log summary{
      cursor:pointer; padding:4px 2px; user-select:none;
      color:var(--muted); outline:none;
    }
    .scan-log summary:hover{ color:var(--fg); }
    /* 複製按鈕：放在記錄上方靠右，小而不搶戲 */
    .scan-log-h{ display:flex; justify-content:flex-end; margin:6px 0 2px; }
    .log-copy{
      font-size:11px; padding:2px 8px; border-radius:6px; cursor:pointer;
      border:1px solid var(--border); background:var(--card); color:var(--muted);
      transition:.14s;
    }
    .log-copy:hover{ color:var(--fg); border-color:var(--accent); }
    .scan-log-b{
      margin-top:6px; padding:8px 9px; line-height:1.75;
      background:var(--inp); border:1px solid var(--border); border-radius:8px;
      font-family:ui-monospace,Consolas,monospace;
      white-space:pre-wrap; word-break:break-all;
      max-height:320px; overflow:auto;
    }

    /* ══ 提示訊息：放在「套用設定」按鈕下方，字要看得清楚 ══ */
    .notice-area{ margin:14px 0 4px; }
    .notice{
      padding:14px 16px; border-radius:10px; border:1px solid var(--border);
      background:var(--card); max-width:760px;
    }
    .notice-t{ font-size:15.5px; font-weight:700; line-height:1.45; }
    .notice-b{ margin-top:6px; font-size:13px; line-height:1.7; color:var(--muted); }
    .notice-warn{
      border-color:rgba(200,30,42,.45); background:rgba(200,30,42,.08);
    }
    .notice-warn .notice-t{ color:#e0313f; }
    .notice-warn .notice-t::before{ content:'⚠ '; }
    .notice-info .notice-t::before{ content:'ⓘ '; }
    .notice-ok{ border-color:rgba(52,168,83,.40); background:rgba(52,168,83,.07); }
    .notice-ok .notice-t{ color:var(--ok); }
    .notice-ok .notice-t::before{ content:'✓ '; }

    /* ══ 有待處理的提示時，「套用設定」按鈕閃紅，讓使用者知道要按哪裡 ══ */
    @keyframes applyPulse{
      0%,100%{ background:#c81e2a; border-color:#c81e2a; color:#fff;
               box-shadow:0 0 0 0 rgba(200,30,42,.55); }
      50%    { background:#8f1620; border-color:#e0313f; color:#fff;
               box-shadow:0 0 0 7px rgba(200,30,42,0); }
    }
    .btn-alert{ animation:applyPulse 1.15s ease-in-out infinite; }

    /* 「改了但還沒套用」→ 套用按鈕亮綠色並輕微呼吸。
       和 .btn-alert（紅色，代表出問題了）刻意分開：
       綠色是「該按我了」，紅色是「有狀況要處理」。 */
    @keyframes dirtyPulse{
      0%,100%{ box-shadow:0 0 0 0 rgba(26,127,75,.55); }
      50%    { box-shadow:0 0 0 7px rgba(26,127,75,0); }
    }
    .btn-dirty{
      background:#1a7f4b; border-color:#1a7f4b; color:#fff;
      animation:dirtyPulse 1.6s ease-in-out infinite;
    }
    /* 未套用的提示框：綠色外框，和警示（紅）、資訊（灰）區分開 */
    .notice-todo{
      border-color:#1a7f4b;
      background:rgba(26,127,75,.10);
    }
    .notice-todo .notice-t{ color:#1a7f4b; }
    @media (prefers-reduced-motion: reduce){
      .btn-dirty{ animation:none; }
    }
    /* 使用者若在系統關掉動畫，就只維持紅底不閃（無障礙） */
    @media (prefers-reduced-motion: reduce){
      .btn-alert{ animation:none; background:#c81e2a; border-color:#c81e2a; color:#fff; }
    }
.dev-name { font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; }
/* Mechanical keyboard icon in device list */
.kb-icon { flex-shrink:0; opacity:.85; color:var(--ok); }

/* 單色／多色的滑動開關 */
.sw-toggle {
  flex:0 0 auto; width:34px; height:19px; padding:0; cursor:pointer;
  position:relative; border:none; border-radius:10px;
  background:var(--border); transition:background .16s;
}
.sw-toggle .sw-knob {
  position:absolute; top:2px; left:2px; width:15px; height:15px;
  border-radius:50%; background:#fff; transition:left .16s;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.sw-toggle.on { background:var(--ok, #22c55e); }
.sw-toggle.on .sw-knob { left:17px; }
.sw-lbl { font-size:11px; color:var(--muted); flex:0 0 auto; }
/* 目前顏色的方塊（點了展開／收折內嵌色輪）*/
.rgb-sw {
  width:30px; height:22px; padding:0; flex:0 0 auto; cursor:pointer;
  border:1px solid var(--border); border-radius:5px;
}
.rgb-sw.open { border-color:var(--accent); box-shadow:0 0 0 2px var(--acc-dim); }
/* 內嵌的色輪面板（不是跳出視窗）*/
.cw-panel {
  margin-top:8px; padding:10px; border-radius:9px;
  background:var(--inp); border:1px solid var(--border);
}
.cw-wrap { display:flex; gap:12px; align-items:center; }
.cw-svg  { display:block; cursor:pointer; }
.cw-svg path:hover, .cw-svg circle:hover { stroke:var(--text); stroke-width:1.5; }
.cw-side { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
.cw-fields { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11px;
             color:var(--muted); }
.cw-fields label { display:flex; align-items:center; gap:3px; }
.cw-fields .timing-inp { width:46px; }
.cw-tip { font-size:11px; color:var(--muted); line-height:1.5; }
/* RGB 色盤與「實際會亮出來的顏色」預覽點。
 * <input type="color"> 各家瀏覽器預設外觀差很多，統一成小方塊。 */
.rgb-pick {
  width:34px; height:22px; padding:0; border:1px solid var(--border);
  border-radius:5px; background:var(--inp); cursor:pointer; flex:0 0 auto;
}
.rgb-pick::-webkit-color-swatch-wrapper { padding:2px; }
.rgb-pick::-webkit-color-swatch { border:none; border-radius:3px; }
/* ★ 預覽點：低亮度時本來就會接近黑色（5% 的白就是深灰）。
 * 使用者回報「其他欄都是壞的」，實際上顯示是對的 —— 問題是一顆深灰
 * 小圓點看起來像壞掉的元件。所以加上外框與底色，讓它讀起來像
 * 「一顆暗著的燈」，而不是「沒有內容」。tooltip 也會寫出實際色碼。 */
.rgb-dot {
  width:15px; height:15px; border-radius:50%; flex:0 0 auto;
  border:1px solid var(--border-strong, rgba(255,255,255,.28));
  margin-left:auto; outline:2px solid var(--card); outline-offset:-3px;
}
/* 小型數字輸入框（連按次數、LED 次數/毫秒、動作間延遲）。
 * 名字留著 .timing-inp 是歷史原因 —— 它原本只給已移除的「自訂秒數」用。 */
.timing-inp {
  width:54px; background:var(--inp); border:1px solid var(--border);
  border-radius:5px; padding:2px 5px; color:var(--text);
  font-size:11px; font-family:inherit; outline:none; text-align:right;
  transition:border-color .14s;
}
.timing-inp:focus { border-color:var(--accent); }
.timing-unit { font-size:11px; color:var(--muted); }
.dev-meta { font-size:11px; color:var(--muted); margin-top:3px; }
.empty-msg { color:var(--muted); font-size:12px; text-align:center; padding:18px 4px; line-height:1.8; }

/* ─── Content ─────────────────────────────────────────────── */
.content { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; }

/* Welcome */
.welcome {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; text-align:center;
}
.w-logo {
  display:flex; align-items:center; justify-content:center;
  user-select:none;
  margin-top:-28px; margin-bottom:48px;   /* LOGO 往上一點、與下方文字拉開距離 */
}
.w-logo-img {
  width:230px; height:auto; display:block;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.22));
}
/* 深色模式：LOGO 加淺色白光暈，避免與黑底太相近 */
[data-theme="dark"] .w-logo-img {
  filter: drop-shadow(0 0 22px rgba(255,255,255,.32))
          drop-shadow(0 0 8px rgba(255,255,255,.22));
}
.w-story {
  max-width:680px; font-size:20pt; color:var(--text); line-height:1.9;
  text-align:justify; margin:0; text-indent:2em;
}
.welcome h2 { font-size:18px; font-weight:600; color:var(--muted); margin:0; }
.welcome p  { font-size:14pt; color:var(--muted); line-height:1.7; margin:0; }
.w-connect-btn {
  font-size:17px; padding:12px 30px; border-radius:10px; font-weight:700;
  background:#c81e2a; border-color:#c81e2a; color:#fff;
}
.w-connect-btn:hover:not(:disabled) { background:#a81824; border-color:#a81824; }
.conn-ico { flex-shrink:0; vertical-align:middle; }

/* ─── Key config card ─────────────────────────────────────── */
.cfg-head {
  display:flex; align-items:baseline; gap:10px; margin-bottom:16px;
}
.cfg-title { font-size:19px; font-weight:700; }
.cfg-sub { font-size:12px; color:var(--muted); }

/* 3-column grid: 按一下 | 按兩下 | 長按 */
.slots-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}
@media (max-width:760px) { .slots-grid { grid-template-columns:1fr; } }

.slot-col {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column;
}
.slot-head {
  background:var(--card); border-bottom:1px solid var(--border);
  padding:10px 14px; display:flex; align-items:center; gap:7px;
  font-size:13px; font-weight:600;
}
.slot-badge {
  font-size:10px; padding:2px 7px; border-radius:10px;
  background:var(--acc-dim); color:var(--accent);
  border:1px solid var(--border); font-weight:600; letter-spacing:.04em;
}
.slot-body { padding:14px; flex:1; display:flex; flex-direction:column; gap:10px; }

/* Mode row: "動作類型" label + dropdown */
.mode-row { display:flex; align-items:center; gap:7px; }
.row-lbl { font-size:12px; color:var(--muted); min-width:52px; flex-shrink:0; }

/* ─── Form controls ───────────────────────────────────────── */
.f-select, .f-input, .f-textarea {
  flex:1; background:var(--inp); border:1px solid var(--border);
  border-radius:7px; padding:7px 10px; color:var(--text);
  font-size:13px; font-family:inherit; outline:none;
  transition:border-color .14s;
}
.f-select:focus, .f-input:focus, .f-textarea:focus { border-color:var(--accent); }
.f-select { cursor:pointer; }
.f-textarea { resize:vertical; min-height:68px; line-height:1.5; }

/* String section inside a slot */
.str-section { display:flex; flex-direction:column; gap:6px; }
.str-label { font-size:12px; color:var(--muted); }
.char-hint { font-size:11px; color:var(--muted); text-align:right; }

/* Divider */
.divider { border:none; border-top:1px solid var(--border); margin:2px 0; }

/* Combo display row */
.combo-field { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.combo-chips { display:flex; align-items:center; gap:3px; flex-wrap:wrap; flex:1; min-height:28px; }
.chip {
  display:inline-flex; align-items:center;
  background:var(--card); border:1px solid var(--border);
  border-radius:5px; padding:3px 7px;
  font-size:11px; font-family:'Courier New',monospace; font-weight:600;
}
.chip-plus { color:var(--muted); font-size:13px; }
.no-combo { font-size:12px; color:var(--muted); font-style:italic; }

/* Disabled hint */
.off-hint { font-size:12px; color:var(--muted); padding:4px 0; line-height:1.7; }

/* ─── Press-type columns (horizontal) + macro steps (vertical) ── */
.macro-hint {
  display:flex; gap:20px; flex-wrap:wrap; margin-bottom:16px;
  font-size:12px; color:var(--muted);
}
.macro-hint .ax { display:inline-flex; align-items:baseline; gap:4px; }
.macro-hint b { color:var(--text); font-weight:700; }

/* 每個按法欄下方的 LED 連動設定 */
.led-block {
  border-top:1px dashed var(--border); padding:10px 12px 12px;
  display:flex; flex-direction:column; gap:6px;
}
.led-title { font-size:12px; font-weight:600; color:var(--muted); }
.led-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.led-param { display:flex; align-items:center; gap:3px; }

/* 連動 LED 指示燈開關 */
.led-link-row {
  display:flex; align-items:center; gap:10px; margin-bottom:16px;
  font-size:13px; font-weight:600; color:var(--text);
}
.switch {
  position:relative; width:52px; height:26px; border-radius:14px;
  border:none; cursor:pointer; padding:0; flex-shrink:0;
  background:var(--border); transition:background .2s;
}
.switch.on { background:#22c55e; }
.switch .knob {
  position:absolute; top:3px; left:3px; width:20px; height:20px;
  border-radius:50%; background:#fff; transition:left .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.switch.on .knob { left:29px; }
.switch-state { font-size:12px; font-weight:700; color:var(--muted); min-width:26px; }
.switch.on ~ .switch-state { color:#22c55e; }

/* 側欄：裝置連線中斷標示 */
.dev-lost { margin-top:4px; font-size:11px; font-weight:700; color:#e5484d; }

/* 字串含中文的警告 */
.cjk-warn { font-size:11px; color:#e5484d; line-height:1.5; margin-top:2px; }

.press-cols {
  display:flex; gap:14px; align-items:flex-start;
  align-self:flex-start; flex:none;    /* 不被壓縮 */
  width:max-content; min-width:100%;   /* 讓欄位自然展開，交給 .content 產生左右拉霸 */
  padding-bottom:6px; margin-bottom:16px;
}
.press-col-wrap {
  flex:none; display:flex; flex-direction:column; align-items:center; gap:12px;
}
.press-col {
  width:300px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; overflow:hidden; display:flex; flex-direction:column;
  align-self:stretch;
  position:relative;              /* 給 .col-del 定位用（見下方） */
}
.press-head {
  background:var(--card); border-bottom:1px solid var(--border);
  /* 右邊留 34px 給固定在角落的 ✕，內容不會跑到它下面 */
  padding:9px 34px 9px 11px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.press-ico { font-size:15px; flex-shrink:0; }
/* ★ 下拉可以縮到 64px：加上「自訂按壓次數」的次數欄之後，
   原本 min-width:90px 會讓整列超過 300px 而換行。 */
.press-sel { flex:1 1 70px; min-width:64px; padding:5px 8px; font-size:13px; font-weight:600; }
.count-wrap { display:flex; align-items:center; gap:3px; flex-shrink:0; }
.col-del, .act-del {
  flex-shrink:0; width:22px; height:22px; border-radius:6px;
  border:1px solid var(--border); background:transparent; color:var(--muted);
  cursor:pointer; font-size:12px; line-height:1; display:flex;
  align-items:center; justify-content:center; transition:.14s;
}
/* ★ 關閉鈕【固定在欄位右上角】，不參與 flex 排列。
   原本它是 .press-head 的最後一個 flex 項目 —— 選「自訂按壓次數」時
   多了「次數」欄，整列超過 300px，flex-wrap 就把 ✕ 擠到第二行
   （截圖裡孤零零的那個叉）。改成絕對定位之後，不論哪種按法、
   內容多寬，位置都完全一致。 */
.col-del {
  position:absolute; top:9px; right:9px; z-index:1;
}
.col-del:hover, .act-del:hover { border-color:#e5484d; color:#e5484d; }

.act-list { padding:12px; display:flex; flex-direction:column; gap:10px; }
.act-card {
  background:var(--card2); border:1px solid var(--border);
  border-radius:10px; padding:11px; display:flex; flex-direction:column; gap:9px;
}
.act-card-head { display:flex; align-items:center; gap:6px; }
.act-num {
  font-size:10px; font-weight:700; letter-spacing:.04em;
  padding:2px 8px; border-radius:9px;
  background:var(--acc-dim); color:var(--accent); border:1px solid var(--border);
}
.act-card-head .act-del { margin-left:auto; }

.delay-row {
  display:flex; align-items:center; gap:5px; margin-top:2px;
  padding-top:9px; border-top:1px dashed var(--border);
  font-size:11px; color:var(--muted);
}
.delay-lbl { flex:1; }

.add-row { padding:0 12px 12px; }
.add-action-btn {
  width:100%; padding:8px; border-radius:8px; cursor:pointer;
  border:1px dashed var(--border); background:transparent; color:var(--muted);
  font-size:12px; font-family:inherit; transition:.14s;
}
.add-action-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--acc-dim); }

.add-circle {
  flex:0 0 auto; width:46px; height:46px; margin-top:6px; border-radius:50%;
  border:2px dashed var(--border); background:transparent; color:var(--muted);
  font-size:22px; cursor:pointer; display:flex; align-items:center;
  justify-content:center; transition:.15s;
}
.add-circle:hover { border-color:var(--accent); color:var(--accent); background:var(--acc-dim); }

/* Bottom action bar */
.action-bar {
  display:flex; gap:8px; justify-content:flex-end;
  padding-top:14px; border-top:1px solid var(--border);
}

/* ─── Combo Modal ─────────────────────────────────────────── */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.72);
  display:flex; align-items:center; justify-content:center;
  z-index:200; opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.open { opacity:1; pointer-events:all; }
.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:22px;
  /* ★ 104 鍵完整鍵盤（含編輯區與數字鍵台）約 900px 寬，原本 800px 會
   * 讓鍵盤永遠處在橫向捲動狀態。放寬到容得下整張圖；螢幕不夠寬時
   * 由 width:calc(100vw-28px) 收窄，.keyboard 的 overflow-x 接手。 */
  max-width:980px; width:calc(100vw - 28px);
  max-height:calc(100vh - 40px); overflow-y:auto;
  transform:translateY(14px); transition:transform .2s;
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}
.overlay.open .modal { transform:translateY(0); }
.modal-hd {
  font-size:16px; font-weight:700;
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.combo-bar {
  background:var(--inp); border:1px solid var(--border);
  border-radius:8px; padding:9px 13px; min-height:40px;
  display:flex; align-items:center; gap:5px; flex-wrap:wrap;
  margin-bottom:14px; font-size:12px;
}

/* Keyboard */
.keyboard {
  background:var(--card); border-radius:11px;
  padding:12px 12px 8px; overflow-x:auto; margin-bottom:16px;
  user-select:none;
}
.kb-row { display:flex; gap:4px; margin-bottom:4px; }
.kb-key {
  /* height 要跟 JS 的 U（單位鍵寬）一致，鍵帽才接近正方形 —— 見 kpx() 的說明。
   * padding 收到 3px：1.25u 的鍵（Insert / Delete）才容得下 6 個字。 */
  height:32px; display:flex; align-items:center; justify-content:center;
  background:var(--card); border:1px solid rgba(255,255,255,.08);
  border-bottom:2px solid rgba(0,0,0,.4);
  border-radius:5px; font-size:11px; cursor:pointer; flex-shrink:0;
  padding:0 3px; white-space:nowrap; color:var(--text); overflow:hidden;
  transition:border-color .1s,background .1s;
}
[data-theme="light"] .kb-key { background:#e4e4e6; border-color:rgba(0,0,0,.12); border-bottom-color:rgba(0,0,0,.2); }
.kb-key:hover { border-color:var(--accent); background:var(--acc-dim); }
.kb-key.sel { background:var(--accent); border-color:var(--accent); color:var(--on-accent); border-bottom-color:rgba(0,0,0,.3); }
.kb-key.msel { background:var(--purple); border-color:var(--purple); color:var(--on-accent); border-bottom-color:rgba(0,0,0,.3); }

/* Toast */
.toast {
  position:fixed; bottom:18px; right:18px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:9px; padding:9px 16px; font-size:13px;
  z-index:300; opacity:0; transform:translateY(8px);
  transition:all .25s; pointer-events:none;
}
.toast.show { opacity:1; transform:translateY(0); }
.toast.ok  { border-color:var(--ok);     color:var(--ok);     }
.toast.err { border-color:var(--accent); color:var(--accent); }

/* 置中的「已套用設定」明顯提示 */
.apply-flash {
  position:fixed; inset:0; z-index:400; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .18s;
}
.apply-flash.show { opacity:1; }
.apply-flash .box {
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:2px solid #22c55e;
  color:var(--text); padding:20px 40px; border-radius:16px;
  font-size:22px; font-weight:700;
  box-shadow:0 12px 50px rgba(0,0,0,.45);
  transform:scale(.9); transition:transform .18s;
}
.apply-flash.show .box { transform:scale(1); }
.apply-flash .chk {
  width:30px; height:30px; border-radius:50%; background:#22c55e; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}

/* Long-press progress animation on connect button */
@keyframes lp-fill {
  from { box-shadow: inset 0 0 0 0 rgba(150,150,150,.5); }
  to   { box-shadow: inset 0 0 0 40px rgba(150,150,150,.5); }
}
.btn-lp { animation: lp-fill 3s linear forwards; }

/* Scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .btn-scan{
      display:flex; align-items:center; justify-content:center; gap:6px;
      width:100%; margin-top:10px; padding:8px 10px;
      font:inherit; font-size:12.5px; color:var(--muted);
      background:var(--card2); border:1px solid var(--border);
      border-radius:8px; cursor:pointer; transition:.15s;
    }
    .btn-scan:hover{ color:var(--text); border-color:var(--purple); background:var(--card); }
</style>
</head>
<body>

<!-- ══ HEADER ═══════════════════════════════════════════════ -->
<header>
  <div class="logo"><span class="brand" id="brandTag">KEY都蘭</span> <em id="hdrSub">鍵盤設定</em></div>
  <div class="hdr-r">
    <button class="btn btn-sm" id="connBtn"
      onclick="connectHID()"
      onmousedown="lpStart()" onmouseup="lpCancel()" onmouseleave="lpCancel()"
      ontouchstart="lpStart(event)" ontouchend="lpCancel()"
      title="長按 3 秒：示範模式 / 斷線">
      <span class="led" id="connLed"></span>
      <span id="connTxt">連接裝置</span>
    </button>
    <button class="btn btn-icon" id="themeBtn" onclick="toggleTheme()" title="切換主題">🌙</button>
    <button class="btn btn-icon" id="langBtn"  onclick="toggleLang()"  title="Language">中</button>
  </div>
</header>

<!-- ══ LAYOUT ════════════════════════════════════════════════ -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-label" id="lbl-dev">目前裝置</div>
    <!-- ★ 裝置清單只放裝置本身，並且是唯一會滾動 / 伸展（flex:1）的區塊。
         掃描按鈕與提示放在它【外面】，位置才不會被清單高度推走。
         之前按鈕塞在 .dev-list 裡，而 .dev-list 是 flex:1，
         所以按鈕被推到側欄最底部（就是你看到的狀況）。
         側欄原本還有一顆「重新整理裝置」，功能與掃描完全相同 → 移除，只留一顆。 -->
    <div class="dev-list" id="devList">
      <div class="empty-msg" id="emptyMsg">尚未連線<br>請點擊「連接裝置」</div>
    </div>
    <button class="btn-scan" id="scanBtn" onclick="scanBus()" disabled title="掃描串接裝置">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14"/>
      </svg><span id="lbl-scan">掃描串接裝置</span>
    </button>
    <!-- ★ 新增串接按鍵（位址指派）。放在掃描按鈕下面 ——
         使用者的順序一定是「掃描沒看到新按鍵 → 才需要指派」。 -->
    <button class="btn-scan" id="addKeyBtn" onclick="openAssign()" disabled
            title="新增串接按鍵"><span id="lbl-addkey">＋ 新增串接按鍵</span></button>
    <!-- 提示訊息已改放在「套用設定」按鈕下方（見 .notice-area），
         這裡保留一個空容器只是為了讓 renderDevList 不必判斷有無。 -->
    <div id="devNotice"></div>
  </aside>

  <!-- Main content -->
  <main class="content" id="content">

    <!-- Welcome (no device) -->
    <div class="welcome" id="welcome">

      <!-- KEY都蘭 Logo：使用原始 LOGO（已去背） -->

let lang = 'zh';
const T = k => STR[lang][k] ?? k;

/* ────────────────────────────────────────────────────────────
   Protocol constants
   ──────────────────────────────────────────────────────────
   Feature Report ID 0x01, 63-byte payload:
     [0]  Command  0x10=write  0x11=read  0x20=scan
     [1]  I²C address (0x00 = this USB device)
     [2]  Slot-0 type  (0=none 1=string 2=key 3=combo)
     [3]  Slot-0 string length
     [4–23] Slot-0 string (20 bytes)
     [24] Slot-0 modifier byte
     [25] Slot-0 keycode
     [26–47] Slot-1 (same 22-byte block)
     [48–69] Slot-2 (same 22-byte block)
     [70] Flags: bit0=key_sound
   ────────────────────────────────────────────────────────── */
const ACT_NONE = 0, ACT_STR = 1, ACT_KEY = 2, ACT_COMBO = 3;

/* HID keycodes → display name */

/* ★ 鍵寬換算：kpx(u) = U*u + G*(u-1)  → 展開成 (U+G)*u - G
 *
 * ⚠ U 和 G 不能亂挑。104 鍵圖用到 0.25 單位（1.25 / 1.75 / 2.25 / 2.75 /
 *   6.25），(U+G) 必須是 4 的倍數，否則 kpx 會算出 .5 而被 Math.round
 *   吃掉 —— 每一列的小數鍵數量不同，捨入誤差就【累積成不同的總寬】：
 *   實測 U=34/G=4（U+G=38，38*0.25=9.5）時，同樣 23.75 單位的五列
 *   分別算出 900 / 900 / 900 / 901 / 904 px，最右邊的數字鍵台會歪 4px。
 *
 *   U=32 / G=4 → U+G=36，36*0.25=9，每個 0.25 單位都是整數，五列同寬。
 *   _test24 ⑦ 會驗「所有用到的寬度都不需要捨入」與「五列像素等寬」。
 *
 * ⚠ 改 U 要一起改 CSS 的 .kb-key{height} —— 鍵帽才會維持接近正方形。 */
const U=32, G=4;
function kpx(u) { return u*U+(u-1)*G; }

  try{

      /* 鍵在 JSON 裡會變成字串，轉回數字位址 */
      Object.keys(o.cfg).forEach(k=>{ cfgStore[Number(k)] = o.cfg[k]; });
    }
    if(Array.isArray(o.seen)) o.seen.forEach(a=>{ if(seenAddrs.indexOf(a)<0) seenAddrs.push(a); });
  }catch(e){}
}

async function connectHID() {
  if (_lpFired) { _lpFired = false; return; }   // 長按已觸發示範模式，忽略 click
  if (!navigator.hid) { toast(T('no_webhid'), 'err'); return; }
  try {
    /* KEY都蘭 CH552 韌體的 VID/PID（見 USBconstant.c: 0x1209 / 0xC55D）。
     * ★ 一定要連 PID 一起篩：0x1A86 是 WCH 的通用 VID，只篩 VID 的話
     * 使用者的選單裡會出現一堆不相關的 WCH 裝置（各種 USB 轉序列埠等）。 */
    const devs = await navigator.hid.requestDevice({ filters:[
      { vendorId:0x1209, productId:KEY_PID },
      { vendorId:0x1A86, productId:KEY_PID }
    ] });
    if (!devs.length) return;
    if (await attachDev(devs[0])) everConnected = true;   // 之後被拔掉才會自動接回
  } catch(e) { toast(T('conn_err')+': '+e.message,'err'); }
}

/* ══════════════════════════════════════════════════════════
   自動連線
   WebHID 的授權是「每個網站記住一次」的 —— 第一次按過「連接裝置」
   之後，navigator.hid.getDevices() 就能在沒有點擊的情況下拿到它，
   所以重新插拔可以自動接回，不必每次都按按鈕。
   ══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════
   ★ HID 描述子的【主機端】解析結果

   為什麼要這個：多媒體鍵實測沒反應，但韌體那條路逐行都查過了 ——
   網頁編碼、封包欄位、macroKey 的媒體攔截、Consumer_press、
   HID 描述子（Report ID 4、Consumer page、16-bit array）全部正確。
   紙面全對而實機不動，就必須確認【主機到底看到了什麼】。

   WebHID 的 device.collections 正好就是瀏覽器解析描述子的結果，
   所以不必燒任何韌體、不花 ROM 就能分辨兩種完全不同的情況：
     ・有 usagePage 0x0C 的 collection 且含 Report ID 4
         → 主機認得媒體鍵，問題在「送出」那一端（或 Windows 端）
     ・沒有
         → 描述子沒被主機接受／沒傳完，問題在描述子或 USB 層
   這是這次唯一還沒被實際觀測過的環節。 */
function logHidCollections(d){
  try{
    const cols = d.collections || [];
    if(!cols.length){ logScan('HID collections：瀏覽器沒有提供（無法判斷）'); return; }
    let hasConsumer = false, hasRid4 = false;
    cols.forEach(c=>{
      const up = '0x'+(c.usagePage||0).toString(16);
      const ins = (c.inputReports ||[]).map(r=>r.reportId).join(',') || '-';
      const outs= (c.outputReports||[]).map(r=>r.reportId).join(',') || '-';
      logScan('HID collection usagePage='+up+' usage=0x'+(c.usage||0).toString(16)
              +' 輸入報告='+ins+' 輸出報告='+outs);
      if(c.usagePage === 0x0C){
        hasConsumer = true;
        if((c.inputReports||[]).some(r=>r.reportId === 4)) hasRid4 = true;
      }
    });
    logScan(hasRid4
      ? '　→ 媒體鍵：主機認得 Consumer(0x0C) 的 Report ID 4 → 描述子沒問題，問題在送出端'
      : (hasConsumer
          ? '　→ 媒體鍵：有 Consumer collection 但【沒有 Report ID 4】→ 描述子有問題'
          : '　→ 媒體鍵：主機【完全沒有】Consumer(0x0C) collection → 描述子沒被接受或沒傳完'));
  }catch(e){ logScan('HID collections 讀取失敗：'+e.message); }
}

async function attachDev(dev){
  try{
    hid = dev;
    if(!hid.opened) await hid.open();
    hid.addEventListener('inputreport', onInput);
    isDemo = false;
    setConn(true);
    logHidCollections(hid);
    addSingle();
    return true;
  }catch(e){ hid=null; return false; }
}

/* 自動接回時也要同樣嚴格 —— 否則插上任何 WCH 裝置都會被當成 KEY都蘭。 */
function isOurs(d){
  return d.productId === KEY_PID && (d.vendorId === 0x1209 || d.vendorId === 0x1A86);
}

/* ★ 刻意「不」在開啟頁面時自動連線 —— 首頁有產品介紹，
 * 一進來就跳到設定頁使用者會看不到。只有在使用者這次已經按過
 * 「連接裝置」、之後才被拔掉的情況下，重新插上才自動接回。 */
let everConnected = false;      // 這次瀏覽階段是否已手動連過

if (navigator.hid) {
  navigator.hid.addEventListener('connect', async (ev) => {
    if(!everConnected) return;            // 還在首頁 → 不自動跳進設定頁
    if(hid || !isOurs(ev.device)) return;
    if(await attachDev(ev.device)){
      /* ★ 換了 USB 埠或對調了模組 → 一定會先 disconnect 再 connect。
       * WebHID 不提供序號，網頁【無法分辨現在連到的是哪一顆】，
       * 所以只要走過這條路徑就提醒使用者確認對應關係。
       *
       * 為什麼需要提醒：設定是存在各自的 DataFlash 裡、跟著板子走的。
       * 對調之後「清單上的 KEY #1」對應到的是另一顆實體模組，
       * 它身上帶的是原本 KEY #2 的設定 —— 清單與硬體就錯開了。 */
      /* 不做任何自動判斷 —— 清單下方有常駐的「重新套用全部設定」按鈕。 */
      /* ★ 主控可能換人了（USB 線移到另一片）→ 位址會整組改變，
       * 所以重新掃描，否則清單裡的位址是舊的、套用會灌到錯的裝置。
       * 掃完之後自動重灌設定 —— 韌體的 DataFlash 目前關閉，裝置一斷電
       * 設定就沒了，讓使用者每次手動按套用太容易忘（症狀就是「按沒反應」）。 */
      /* ★ 不能太快掃。主控剛開機時 setup() 會先等 USB 列舉、再補齊到固定
       * 1.5 秒（流水燈要對齊），之後才進 loop() —— 在那之前掃描封包
       * 雖然會被中斷收下，但要等 setup 結束才處理。
       * 原本只等 400ms，掃描常在主控還沒進 loop() 時就逾時 →
       * 顯示「沒有找到串接裝置」，要手動再按一次。 */
      /* ★ 第二個參數 true = 自動掃描。少傳它會被當成「手動」→
       * 不會自動重試、還會累加失敗次數（使用者沒按 3 次就跳接線警語）。 */
      scheduleScan(SCAN_FIRST_MS, true);
    }
  });
}

/* 硬體被拔除 → 標示「連線中斷」，但不跳回首頁、保留目前設定畫面 */
if (navigator.hid) {
  navigator.hid.addEventListener('disconnect', (ev) => {
    if (hid && ev.device === hid) {
      hid = null;
      isConn = false;
      setConn(false);                       // 頂端變未連線（LED紅、品牌取消高亮）
      devices.forEach(d => d.disc = true);  // 側欄標記連線中斷
      renderDevList();
      flashBanner(T('conn_lost'), false);   // 置中大提示（同套用設定的風格）
      // 不呼叫 deactivate()：保留左側裝置與中間的設定內容
    }
  });
}

function setConn(ok) {
  isConn = ok;
  document.getElementById('connLed').className = 'led'+(ok?' ok':'');
  document.getElementById('connTxt').textContent = T(ok ? 'connected' : 'connect');
  document.getElementById('scanBtn').disabled = !ok || scanning;
  /* 位址指派需要主控在線（廣播是主控發的），而且不能和掃描同時進行 */
  const ak = document.getElementById('addKeyBtn');
  if(ak) ak.disabled = !ok || scanning || isDemo;
  document.body.classList.toggle('is-conn', ok);
}

/* ── New data model ──────────────────────────────────────────
   edit = [ column ]                         (horizontal = 按法設定)
   column = { press, count, timing, actions:[ action ] }  (vertical actions = 巨集設定)
   action = { type, str, key, mod }          (a sequential step)
   press: 'single' | 'double' | 'long' | 'custom'
   ──────────────────────────────────────────────────────────── */
function newAction(){ return {type:ACT_STR, str:'', key:0, mod:0, delay:0}; }
/* ══════════════════════════════════════════════════════════════
   RGB 指示燈（WS2812，接在 P1.1）
   ──────────────────────────────────────────────────────────────
   顏色是【每個按法欄各自一份】—— 和 ledMode / ledTimes / ledMs 同一層，
   所以可以做到「按一下綠、按兩下藍、長按紅」。

   封包用 RGB565 塞進 p[4..5]（原本 timingMs 留下的 reserved 兩個位元組），
   所以 62 bytes 的封包格式完全沒動。

   ★ 亮度在【網頁端】就先乘進去，送出去的已經是最終值 ——
     8051 沒有硬體乘法，在韌體做亮度縮放要連進乘法例程（要花 ROM）。
     這裡乘一次是零成本。
   ★ 預設亮度刻意只有 25%：WS2812 全亮非常刺眼，而這是指示燈不是照明。
   ══════════════════════════════════════════════════════════════ */
/* ★ 預設是【純綠】。原本是 {0,255,80}（#00FF50，青綠色）——
 * 使用者回報「按鍵一的綠色混了白光」，而那顆板子用的就是這個預設值：
 * b=80 是真的有藍光，不是傳輸壞掉。預設值不該是個「看起來像純色但不是」
 * 的顏色，而且新增的 HEX 欄位會讓實際值一眼看得到。 */
const RGB_DEF   = { r:0, g:255, b:0 };
const RGB_BRI_DEF = 60;                   /* 預設亮度 %（1~100）—— gamma 修正後要調高 */

/* ══════════════════════════════════════════════════════════════
   ★ gamma 修正 —— 「設橘色卻亮成黃色」的原因
   ──────────────────────────────────────────────────────────────
   色盤給的是 sRGB（已經做過 gamma 編碼的值），而 WS2812 的 PWM 是
   【線性光】。直接把 sRGB 數值餵進去，中間調就會過亮。

   實際案例：橘色 #FF8000 → R:G = 255:128 = 2:1。直接送過去，
   LED 兩個晶粒的【光輸出】比也是 2:1 —— 但綠色晶粒的發光效率遠高於
   紅色，加上人眼對綠最敏感，看起來就變成黃色。

   正確做法是先把 sRGB 轉成線性光：
       linear = 255 × (sRGB/255)^2.2
   橘色變成 R:G = 255:53 ≈ 4.8:1，看起來才是橘色。

   ⚠ gamma 會讓整體變暗（中間調掉得最多），所以預設亮度從 25% 提到 60%。
   ══════════════════════════════════════════════════════════════ */
const GAMMA = 2.2;
function srgbToLinear(v){
  return Math.round(255 * Math.pow(Math.max(0, Math.min(255, v)) / 255, GAMMA));
}

/* {r,g,b} 0~255 (sRGB) + 亮度% → RGB565 的兩個位元組（小端，對應 p[4]/p[5]）
 * 順序：sRGB → 線性光 → 乘亮度（亮度本來就是線性的光輸出比例）→ 量化成 565 */
function rgbPack(c, bri){
  const k = Math.max(0, Math.min(100, bri===undefined?RGB_BRI_DEF:bri)) / 100;
  const ch = (v) => Math.round(srgbToLinear(v) * k);
  const r = ch(c&&c.r||0), g = ch(c&&c.g||0), b = ch(c&&c.b||0);
  const v = ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
  return [v & 0xFF, (v >> 8) & 0xFF];
}
/* #rrggbb ↔ {r,g,b}（<input type="color"> 用的格式）*/
function rgbToHex(c){
  const h = n => ('0' + Math.max(0,Math.min(255,n|0)).toString(16)).slice(-2);
  return '#' + h(c&&c.r||0) + h(c&&c.g||0) + h(c&&c.b||0);
}
function hexToRgb(s){
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(s||''));
  return m ? { r:parseInt(m[1],16), g:parseInt(m[2],16), b:parseInt(m[3],16) }
           : { r:RGB_DEF.r, g:RGB_DEF.g, b:RGB_DEF.b };
}

/* LED 模式：0=關閉 1=閃燈N次 2=恆亮Xms 3=呼吸燈Xms */
const LED_OFF=0, LED_BLINK=1, LED_SOLID=2;
/* ★ LED_BREATH(3) 已從 UI 移除 —— 韌體是 USE_BREATHE=0，選了會落到預設分支

 * 舊設定（localStorage 或裝置裡）若是 3，載入時正規化成閃燈（見 cloneCfg）。 */

/* ══════════════════════════════════════════════════════════
   韌體上限（必須與 KEYAtolan_CH552G.ino 一致）
   ──────────────────────────────────────────────────────────
   MAX_COLS / MAX_ACTIONS：超出的封包韌體會直接略過。更糟的是若「最後一包」

     （欄頭 9 B），這裡算 7 B 會讓網頁放行一份存不下的設定，而
     saveConfig() 只會從後面靜默截斷 —— 網頁仍顯示成功。
     所以改這個常數就一定要重燒兩片板子。
   ══════════════════════════════════════════════════════════ */
const KEY_PID = 0xC55D;   // USBconstant.c 的 .ProductID
const FW_MAX_COLS    = 4;
const FW_MAX_ACTIONS = 4;
const FW_CFG_LIMIT   = 124;
const FW_STR_MAX     = 20;
/* ══════════════════════════════════════════════════════════════
   ★ 動作間延遲的上限 —— 從 60000ms 降到 5000ms
   ──────────────────────────────────────────────────────────────
   韌體是 `if (ac->delayMs) delay(ac->delayMs);`，而 delay() 在 8051 上
   是【阻塞】的忙等。設 60 秒的話，主控整整一分鐘不回主迴圈：
     ・不掃自己的按鍵（按了完全沒反應）
     ・不服務總線（從控的 ALERT# 沒人理，KEY2/KEY3 全部失效）
     ・網頁的掃描與套用都會逾時
   USB 還在列舉，所以裝置「看起來活著但全部失靈」—— 這是最難自我診斷的
   失效模式，而且是使用者自己在 UI 上設出來的。

   5 秒已經遠超過任何巨集的實際需求，而且 5 秒的停頓還在「我剛才是不是
   設錯了」的可理解範圍內。需要更長的間隔就多加一個步驟串起來。
   ══════════════════════════════════════════════════════════════ */
const FW_DELAY_MAX   = 5000;
/* 每個動作【自身】的固定耗時（毫秒），由韌體程式碼直接算出來：
 *   組合鍵/功能鍵 macroCombo : delay(5)+delay(5)+delay(30)+delay(15) = 55
 *   媒體鍵        macroKey   : delay(30)+delay(15)            = 45
 *   字串          typeAscii  : 每字元 delay(4)（外加 USB 送出的時間）
 * 這些【不含】使用者設定的延遲 —— 兩者是相加的。
 * 用途：在 UI 上把「實際間隔」講清楚，不要讓 0ms 被誤解成「沒有間隔」。 */
const ACT_OVERHEAD = { combo: 55, media: 45, perChar: 4 };
/* 從控（KEY2 以上）每個動作還要多一次總線往返。
 * 韌體註解裡的實測值：喚醒 25ms + 短框 6ms + 讀回 28 bytes 33.6ms ≈ 65ms。 */
const BUS_FETCH_MS = 65;
/* ★ 抽成常數：原本 9 和 6 分別寫死在 cfgBytes、ADD_COL_COST、ADD_ACT_COST
 * 三處。欄頭從 9 改 7 時漏改任何一處，網頁算出的容量就和韌體不一致 ——
 * 症狀是「套用回報成功但設定被靜默截斷」，最難查的那種。 */
const COL_HEAD_BYTES = 9;   // saveConfig 每欄的固定開銷（含 2 bytes 的 RGB565 顏色）
const ACT_HEAD_BYTES = 6;   // saveConfig 每動作的固定開銷（不含字串）

/* 一份設定寫進 DataFlash 會佔幾個位元組（與 saveConfig 同一套算法） */
/* 一個動作在 DataFlash 的可變長度部分佔幾 bytes。
 * ★ 組合鍵借用字串欄位裝「第 2 個之後的主鍵」（見 macroCombo），
 *   所以它的可變部分是 ext 的個數，不是 str 的長度。 */
function actPayloadBytes(a){
  if(a.type===ACT_COMBO)
    return (Array.isArray(a.ext)?a.ext:[]).filter(k=>k>0).length;
  return strBytes(a.str);
}
function cfgBytes(cfg){
  let n = 2;
  cfg.forEach(c=>{
    n += COL_HEAD_BYTES;
    c.actions.forEach(a=>{ n += ACT_HEAD_BYTES + actPayloadBytes(a); });
  });
  return n;
}
/* 字串的位元組數。韌體只輸出可列印 ASCII，所以非 ASCII 一律不計也不允許輸入。 */
function strBytes(str){ return (str||'').length; }

/* 再加一個【欄】需要多少位元組：欄頭 + 它預設帶的一個空動作 */
const ADD_COL_COST = COL_HEAD_BYTES + ACT_HEAD_BYTES;
/* 再加一個【動作】需要多少位元組：動作頭（字串一開始是空的） */
const ADD_ACT_COST = ACT_HEAD_BYTES;

/* 還剩多少位元組可用 */
function cfgFree(cfg){ return FW_CFG_LIMIT - cfgBytes(cfg); }

/* 能不能再加一欄 / 一個動作 —— 同時看「數量上限」與「容量」 */
function canAddCol(cfg){ return cfg.length < FW_MAX_COLS && cfgFree(cfg) >= ADD_COL_COST; }
function canAddAct(cfg, ci){
  return cfg[ci].actions.length < FW_MAX_ACTIONS && cfgFree(cfg) >= ADD_ACT_COST;
}
/* 停用的原因：數量到頂 or 容量不夠 —— 要告訴使用者是哪一個 */
function addColWhy(cfg){
  if(cfg.length >= FW_MAX_COLS) return T('max_cols');
  return T('no_room').replace('%n', String(ADD_COL_COST)).replace('%f', String(cfgFree(cfg)));
}
function addActWhy(cfg, ci){
  if(cfg[ci].actions.length >= FW_MAX_ACTIONS) return T('max_acts');
  return T('no_room').replace('%n', String(ADD_ACT_COST)).replace('%f', String(cfgFree(cfg)));
}

/* 找出「從哪一個動作開始放不下」，好明確告訴使用者，而不是只說超出。
 * 掃描順序與 saveConfig() 相同（逐欄、逐動作），回傳 null = 放得下。 */
/* ⚠ 這裡原本寫死 9 和 6 —— 而 cfgBytes 已經改用 COL_HEAD_BYTES /
 *   ACT_HEAD_BYTES（欄頭從 9 降到 7）。兩個函式對同一份設定會算出不同
 *   的容量，症狀是「cfgBytes 說放得下、cfgOverflow 說第 3 欄放不下」
 *   這種互相矛盾的訊息。改用同一組常數。 */
function cfgOverflow(cfg){
  let n = 2;
  for(let ci=0; ci<cfg.length; ci++){
    if(n + COL_HEAD_BYTES > FW_CFG_LIMIT) return { col:ci+1, act:0, used:n };
    n += COL_HEAD_BYTES;
    const acts = cfg[ci].actions;
    for(let ai=0; ai<acts.length; ai++){
      const need = ACT_HEAD_BYTES + actPayloadBytes(acts[ai]);
      if(n + need > FW_CFG_LIMIT) return { col:ci+1, act:ai+1, used:n };
      n += need;
    }
  }
  return null;
}

/* 按法名稱 → 韌體的 press 代碼（封包 p[2]）。
 * ★ 必須與 KEYAtolan_CH552G.ino 的 PRESS_SINGLE/DOUBLE/LONG/CUSTOM 一致。
 * 這張表的宣告不能刪 —— 少了它 writeDev 會丟 ReferenceError，
 * 所有裝置的「套用設定」都會失敗。 */
const PRESS_CODE = { single:0, double:1, long:2, custom:3 };

/* ══════════════════════════════════════════════════════════════
   ★ 「自訂秒數」已整個移除（原本這裡有 defTiming()）
   ──────────────────────────────────────────────────────────────
   每欄本來有一個 ms 輸入框，值會存進 edit、打包成封包 [4..5]、寫進
   裝置的 DataFlash、還會透過總線轉發到從控 —— 然後 keyTask 從來沒讀它。
   韌體用的是寫死的：
       LONG_TICKS  120 → 600ms 長按門檻
       MULTI_TICKS  50 → 250ms 連擊視窗
   也就是說使用者把長按改成 800ms，實際仍然是 600ms。整條路徑看起來
   都在運作（套用會成功、重整後值還在），只有真正的行為不受影響 ——
   這種「假設定」比缺少功能更糟。

   實測寫死的秒數沒問題，所以選擇【移除 UI】而不是把它接到韌體上：
   接上去要多花 ROM，而 ROM 只剩 71 bytes，得留給多顆串接。

   封包 [4..5] 保留成 reserved 並固定送 0 —— 不動 62 bytes 格式，
   新網頁配舊韌體、舊網頁配新韌體都不會錯位。
   ══════════════════════════════════════════════════════════════ */
function newCol(press){
  press = press || 'single';
  const count  = press==='custom' ? 3 : (press==='double' ? 2 : 1);
  return { press, count, actions:[ newAction() ],
           ledMode:LED_BLINK, ledTimes:1, ledMs:500,
           rgbOn:true,
           rgb:{ r:RGB_DEF.r, g:RGB_DEF.g, b:RGB_DEF.b }, bri:RGB_BRI_DEF };
}
function mkCfg(){ return [ newCol('single') ]; }
function cloneCfg(cfg){
  /* ★ 刻意不再帶 timing —— 舊的 localStorage 設定裡還會有這個欄位，
   * 讓它在這裡自然被丟掉，之後的 isDirty 比對才不會被幽靈欄位干擾。 */
  return cfg.map(c=>({ press:c.press, count:c.count,
    /* ★ 舊設定若是呼吸燈(3) 一律改成閃燈：韌體 USE_BREATHE=0，
     * 留著 3 會落到預設分支 → 完全不亮，使用者只會覺得「LED 壞了」。 */
    ledMode:(c.ledMode===undefined || c.ledMode===LED_BREATH_LEGACY)
              ? LED_BLINK : c.ledMode,
    ledTimes:(c.ledTimes||1), ledMs:(c.ledMs||500),
    /* ★ 顏色與亮度也要進快照，否則「改了顏色」不會亮綠燈 ——
     * 和延遲欄位當初一樣的坑（快照漏欄位＝那個欄位的修改看不見）。
     * 舊的 localStorage 設定沒有這兩個欄位，補上預設值。 */
    rgb: c.rgb ? { r:c.rgb.r|0, g:c.rgb.g|0, b:c.rgb.b|0 }
               : { r:RGB_DEF.r, g:RGB_DEF.g, b:RGB_DEF.b },
    bri: (c.bri===undefined ? RGB_BRI_DEF : c.bri),
    /* 單色／多色的切換。舊設定沒有這個欄位 → 當成多色（既有行為不變）。 */
    rgbOn: (c.rgbOn===undefined ? true : !!c.rgbOn),
    actions:c.actions.map(cpSlot) }));
}
/* migrate old 3-slot data → column model */

/* 保留使用者的設定：斷線/重新連線後不要重置選項 */

function addSingle() {

  if (!cfgStore[0x00]) cfgStore[0x00] = savedCfg ? cloneCfg(savedCfg) : mkCfg();
  if (seenAddrs.indexOf(0x00) < 0) seenAddrs.unshift(0x00);

  scheduleScan(SCAN_FIRST_MS, true);

/* 掃描總線：送 flags bit6，主控會 ping 所有 slave 位址，

let scanning   = false;

const SCAN_AUTO_MAX = 10;
const SCAN_TIMEOUT  = 4000;

let scanLog = [];
let scanLogOpen = false;      /* 折疊區是否展開（重繪時要保住使用者的選擇）*/

/* 一鍵複製整份診斷記錄。
 * ★ 為什麼值得做：這次除錯有好幾輪是因為「貼回來的內容不完整」而卡住 ——
 *   關鍵的那一行剛好沒被選到、或貼到舊的記錄。整份複製就沒有這個問題。
 * ★ navigator.clipboard 在非 https（file:// 或 http）下不一定可用，
 *   所以一定要有 textarea + execCommand 的退路，否則在本機開檔就按不動。 */
async function copyScanLog(ev){
  if(ev) ev.stopPropagation();          /* 不要順便把 <details> 收起來 */
  const text = scanLog.join('\n');
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text); ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }catch(e){ ok = false; }
  }
  const b = document.getElementById('logCopyBtn');
  if(b) b.textContent = ok ? T('log_copied') : T('log_copy_fail');
  toast(ok ? T('log_copied') : T('log_copy_fail'), ok ? 'ok' : 'err');
  if(b) setTimeout(()=>{ const x=document.getElementById('logCopyBtn');
                         if(x) x.textContent = T('log_copy'); }, 1800);
}
function logScan(txt){
  const t = new Date();
  const hh = String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0')
           + '.' + String(t.getMilliseconds()).padStart(3,'0').slice(0,1);
  scanLog.push(hh+' '+txt);
  /* ★★ 上限從 12 提到 400 ★★
   *
   * 12 行是這次除錯的一個真實障礙：套用設定一次就產生 7 行「送出動作」，
   * 而自動掃描每輪再加 2 行 —— 幾十秒內就把前面的全部擠掉。
   * 結果「韌體執行：…」那行【出現過也會被沖掉】，我卻一直在請使用者
   * 貼一行早就被丟棄的內容，白繞了好幾輪。
   *
   * 診斷記錄是拿來查問題的，不該自己丟掉證據。400 行在記憶體上微不足道
   * （每行幾十位元組），但足以涵蓋「連線 → 套用 → 按好幾次」的完整過程。
   * 真的要清就按重新整理，不要讓它默默遺失。 */
  if(scanLog.length > 400) scanLog.shift();
}
/* 首次自動掃描要等多久：
 *   USB 列舉（→ connect 事件）發生在主控 setup() 的 USBInit()，約上電 0.1 秒。
 *   主控要到上電 ~1.7 秒才進 loop()，slave 因為流水燈延遲要 ~1.9 秒。
 *
 * ★ 原本設 2.5 秒是想「等雙方都開機完成，一次就掃到」。但重試現在是
 *   完全安靜的（不標記未偵測、不跳訊息），所以掃太早沒有任何代價 ——
 *   反而是使用者要多等 2.5 秒才看到 KEY2。改成 1.2 秒起、每 0.7 秒一次，
 *   最快約 1.2 秒就會出現，最長涵蓋到插入後約 8 秒。 */
const SCAN_FIRST_MS = 1200;
const SCAN_RETRY_MS = 700;

/* ★ 掃描只能有一個排程來源。之前有三處各自 setTimeout，會疊在一起輪流跑。 */
function scheduleScan(ms, auto){
  clearTimeout(scanSched);
  /* ★ 在【排程時】就標記序列進行中，不是等掃描真的開始。
   * 否則「插上 → 第一次掃描」之間的空窗沒被涵蓋，
   * 提示還是會先閃出來（就是 #2 的症狀）。 */
  if(auto) autoSeqActive = true;
  scanSched = setTimeout(()=>{ scanBus(auto).catch(()=>{}); }, ms);
}

async function scanBus(auto){
  if(applying){ logScan('略過：正在套用設定'); return; }   /* 見 applying 的說明 */
  if(!hid){ logScan('略過：未連線'); flashBanner(isDemo ? T('no_hw_demo') : T('no_hw'), false); return; }
  /* ★ scanning 卡住的保險：若上一次掃描不知為何沒走到出口（例如掃描途中
   * 被拔線），scanning 會一直是 true，之後所有掃描都被這行擋掉 ——
   * 症狀正是「自動掃描永遠沒反應，手按也要按好幾次」。
   * 超過逾時時間就強制放行。 */
  if(scanning){
    if(Date.now() - scanStart < SCAN_TIMEOUT + 500){ logScan('略過：上一次還在進行'); return; }
    logScan('★ 強制解除卡住的掃描狀態');
    clearTimeout(scanTmr);
  }
  scanning = true;
  scanIsAuto = !!auto;
  scanSkipped = false;
  scanStart = Date.now();
  logScan((auto?'自動':'手動')+'掃描 #'+(auto?scanAuto+1:'-')+' 送出 0x40');
  if(!auto) scanAuto = 0;          // 手動掃描 → 重設自動計數
  renderDevList();
  clearTimeout(scanTmr);
  /* 逾時和「收到回報」共用同一個出口 onScanDone —— 兩邊規則才不會不一致。
   * 之前兩處各寫一套，造成重試次數與失敗計數對不上。 */
  scanTmr = setTimeout(()=>{
    if(!scanning) return;
    scanning = false;
    onScanDone(null, scanIsAuto);   // null = 主控沒回報
  }, SCAN_TIMEOUT);
  const p = new Uint8Array(62);
  p[0] = 0x40;                      // bit6 = 掃描請求
  /* ⚠ 這裡原本寫「p[1] = 給板子的隨機識別碼，板子會存起來」—— 那是【錯的】。
   * 核對韌體：掃描分支（flags bit6）完全沒有讀 p[1]，板子識別碼是從設定封包的
   * `p[33] >> 4` 取的（見 .ino 的 myBoardId）。所以送隨機值只是雜訊，
   * 而那段註解會讓人以為有一套不存在的機制。
   * 送 0 並保持這個位元組為零 —— 位址指派（bit5）才是真正會用 p[1] 的路徑。 */
  p[1] = 0;
  try{
    await hid.sendReport(3, p);
  }catch(e){
    clearTimeout(scanTmr); scanning=false; renderDevList();
    logScan('送出失敗：'+e.message);
    toast(T('save_err')+e.message,'err');
  }
}

/* ★ 側欄提示：一次只顯示一則，依重要性排序。
 * 自動掃描序列還在進行中就完全不顯示 —— 那段期間清單本來就還沒穩定，
 * 先跳結論會讓使用者誤會（症狀：訊息閃一下又消失、或一次跳出四個紅框）。 */
/* ★ 需要使用者按「套用設定」才能解決的狀況 → 按鈕閃紅提示。
 * 純資訊性的（沒找到從控、設定已保存）不算，那按了也沒用。 */
function needAttention(){
  return !autoSeqActive && !!diagInfo && (notSaved() || boardChanged);
}

/* ★ 「這顆還沒有設定」必須看【兩個】訊號，缺一不可：
 *   diagInfo.saved  = DataFlash 第 0 位元組等於 FLASH_MAGIC（真的存過設定）
 *   boardUnset      = 識別碼沒有有效標記（沒被套用過）
 *
 * 為什麼不能只看識別碼：燒錄程式碼不會清掉 DataFlash，剛燒好的板子那些
 * 位元組還留著舊資料，有機率剛好讀起來像一個有效的識別碼 ——
 * 那樣就會對著一顆空白的按鍵說「設定已寫入」（實測到的 bug）。
 * FLASH_MAGIC 每次改佈局都會換版本號，所以剛燒好的板子 saved 一定是 false，
 * 兩個條件合起來就不會被殘留資料騙。 */
function notSaved(){ return boardUnset || !diagInfo || !diagInfo.saved; }

/* 提示訊息：放在「套用設定」按鈕下方（使用者要按的地方就在旁邊），
 * 一次只講一則，自動掃描序列結束前不下任何判斷。
 * 排版：第一行是結論，第二行才是原因與作法 —— 使用者不必讀完整段才知道要做什麼。 */
/* 套用失敗時把逐包記錄顯示出來 —— 只在失敗後出現，平常不佔畫面。 */
function applyLogHtml(){
  if(!applyLog.length) return '';
  return `<div class="dev-log">${applyLog.map(H).join('<br>')}</div>`;
}

function noticeHtml(){
  if(autoSeqActive || !diagInfo) return '';
  const box = (cls, title, body) =>
    `<div class="notice ${cls}">
       <div class="notice-t">${title}</div>
       <div class="notice-b">${body}</div>
     </div>`;
  const sel = devices[selIdx];

  /* ★★ diagInfo.saved 與 boardUnset 都是【只有主控回報的】——
   * 掃描回覆裡只有主控自己 DataFlash 的狀態，從控的讀不到
   * （PING 只回一個 ALERT# 脈衝，沒有資料欄位）。
   * 之前這兩個判斷對所有裝置一律套用，於是選到「按鍵2」時，畫面講的其實是
   * 按鍵1 的儲存狀態 —— 那就是你看到「剛燒完就說已儲存」的一半原因。
   * （另一半不是 bug：燒錄韌體【不會】清掉 DataFlash，所以先前套用過的設定
   *   本來就還在主控裡，對主控而言「已儲存」是事實。）
   * 所以只有選到主控時才拿這兩個訊號下判斷。 */
  const isMasterSel = !!sel && sel.addr === 0x00;

  /* ★ 「改了但還沒套用」優先於其他所有提示 —— 這是【使用者現在就該動手】的事，
   * 而其他提示都只是狀態說明。順序放錯就會出現「設定已寫入按鍵」壓在
   * 剛改好還沒送出的內容上面，那是直接的誤導。 */
  if(isDirty()) return box('notice-todo', T('na_dirty_t'), T('na_dirty_b'));

  if(isMasterSel && notSaved())
    return box('notice-warn', T('na_unset_t'), T('na_unset_b'));
  if(boardChanged) return box('notice-warn', T('na_swap_t'), T('na_swap_b'));
  if(devices.length<=1) return box('notice-info', T('na_alone_t'), T('na_alone_b'));
  /* 只有這次真的套用成功過才敢說「已寫入」—— 見 appliedNow 的說明 */
  if(sel && appliedNow[sel.addr]) return box('notice-ok', T('na_ok_t'), T('na_ok_b'));
  /* 主控之外的裝置：網頁無從得知它裡面存了什麼，就不要假裝知道。 */
  if(!isMasterSel) return box('notice-info', T('na_unknown_t'), T('na_unknown_b'));
  return box('notice-info', T('na_stored_t'), T('na_stored_b'));
}

/* 依掃描結果重建清單。設定一律從 cfgStore 取，永不遺失。 */
/* ══════════════════════════════════════════════════════════════════
   ★★ 幽靈裝置（憑空長出 KEY3）★★

   實測回報：按著 KEY2 的同時按「套用設定」，清單就長出一顆不存在的 KEY3，
   而且重整網頁、重新插拔都還在。

   成因有【兩個】，要分開修：

   ① 韌體端的誤判（PING 的 ACK 會被別人的事件冒名頂替）
      busPing(0x12) 送出後，會等最多 75ms 看 ALERT# 有沒有被拉低當作 ACK。
      但 ALERT# 是【三條線共用】的：如果這 75ms 內使用者按了 KEY2，
      KEY2 為了自己的按鍵事件把 ALERT# 拉低 —— 主控就把它當成
      「0x12 有回應」。0x12 就是清單上的第 3 顆。
      （韌體註解裡本來就寫過「曾造成掃描出幽靈第三台」，只是那條路還在。）

   ② 網頁端讓它變成永久（這才是「重整也還在」的原因）
      seenAddrs 只會增加、從來不會移除，而且會存進 localStorage。
      後來的掃描找不到 0x12 也只是標記「未偵測到」，不會把它拿掉 →
      重新載入又從 localStorage 讀回來 → 永遠都有 KEY3。

/* 修法（分兩層，各自負責一件事，都不靠猜）：
     ・韌體端【預防】：PING 之後必須看到 ALERT# 被放開才採信（見 busSendAck）。
       真的 ACK 會在 delay(20) 後放開；按鍵事件會一直低到被取走 —— 分得出來。
       這才是問題發生的地方，也是唯一能真正預防的地方。
     ・網頁端【給使用者一個明確的出口】：清單上每顆從控都有移除按鈕。

   ★ 這裡試過兩種「自動」的做法，兩種都放棄了，理由記下來免得再繞一次：
     (a)「新位址要連續兩次掃到才採信」
        → KEY2 慢一整輪才出現，而且 autoSeqActive 一直是 true 把提示壓住。
          對一個已經抱怨過「KEY2 出現太慢」的使用者，代價比它防的問題大。
     (b)「連續 N 次掃不到就自動移除」
        → 和前幾輪修好的另一個 bug 直接衝突：掃描顯示「未偵測到」時，
          套用設定必須【照樣嘗試寫入】（掃描是間歇性的，轉發本身有 3 次重試）。
          自動移除會讓那顆裝置不在 todo 裡，套用連試都不會試 —— 把那個修正廢掉。
          我還試著用「設定是空的就當雜訊」來區分，但剛接上還沒設定的真實 KEY2
          也符合這個條件，等於在調參數遷就測試。
     所以不猜：預防交給韌體，要不要移除交給使用者按。
   ══════════════════════════════════════════════════════════════════ */

/* 從清單移除一顆裝置（只有從控可以移除，主控是 USB 上那顆，移除沒有意義）。
 * 一併清掉它的設定 —— 使用者要移除的通常就是幽靈或已經拆掉的模組；
 * 留著設定只會在它下次出現時帶回一份莫名其妙的舊內容。 */
function removeDev(addr, ev){
  if(ev) ev.stopPropagation();                /* 不要順便觸發選取那一列 */
  if(addr === 0x00) return;
  const i = seenAddrs.indexOf(addr);
  if(i < 0) return;
  const nm = devName(i);
  if(!confirm(T('rm_confirm').replace('%s', nm))) return;
  seenAddrs.splice(i, 1);
  delete cfgStore[addr];
  delete appliedNow[addr];
  delete appliedSnap[addr];
  saveStore();
  logScan('使用者移除了位址 0x' + addr.toString(16));
  if(selIdx !== null && selIdx >= seenAddrs.length) selIdx = null;
  rebuildDevices(seenAddrs.filter(a=>a!==addr), false);
  toast(T('rm_done').replace('%s', nm), 'ok');
}

function rebuildDevices(found, flagLost){
  let grew = false;
  found.forEach(a=>{ if(seenAddrs.indexOf(a)<0){ seenAddrs.push(a); grew = true; } });
  if(grew) saveStore();
  devices = seenAddrs.map((a,i)=>{
    if(!cfgStore[a]) cfgStore[a] = mkCfg();
    return { addr:a, _i:i, get name(){ return devName(this._i); }, cfg:cfgStore[a],
             lost:(a!==0x00 && found.indexOf(a)<0 && flagLost), disc:false };
  });
  renderDevList();
  if(selIdx===null || selIdx>=devices.length) selectDev(0); else renderCfg();
}

/* ★ 掃描結束的【唯一】出口。addrs === null 代表逾時。 */
function onScanDone(addrs, auto){
  clearTimeout(scanTmr);
  const timedOut = (addrs === null);
  const found    = addrs || [];

  /* ★ 耗時很重要：主控 ping 每個位址要幾百 ms，所以
   *   「幾百 ms 後回報 0 台」= 真的問過了，是接線／從控的問題；
   *   「不到 100ms 就回報 0 台」= 主控根本沒去問，是韌體那邊的問題。 */
  logScan((timedOut ? '逾時，主控沒回報' : ('主控回報：找到 '+found.length+' 台'))
          + '（耗時 '+(Date.now()-scanStart)+'ms）');


  if(found.length){                       // 找到了
    scanAuto = 0;
    autoSeqActive = false;
    /* ★ 這裡原本會 scanFails = 0。但總線是【間歇性】的 ——
     * 使用者回報「掃描有時候還會掃到 KEY2」，只要中間成功一次計數就歸零，
     * 於是永遠累積不到 3 次，接線警語永遠不出現。
     * 使用者的需求是「按 3 次以上就提示」，不是「連續失敗 3 次」，
     * 所以失敗次數改成累計，成功不歸零。 */
    rebuildDevices(found, false);
    toast(T('scan_done').replace('%d', String(found.length)),'ok');
    return;
  }

  /* 沒找到。自動掃描還有額度就再試 —— 主控開機要 ~1.7 秒才進主迴圈，
   * 太早掃一定是 0 台。這期間【不標記未偵測】，避免畫面跳動。 */
  if(auto && scanAuto < SCAN_AUTO_MAX){
    scanAuto++;
    rebuildDevices(found, false);   /* 這期間不標記「未偵測」，畫面才不會閃 */
    scheduleScan(SCAN_RETRY_MS, true);
    return;                          /* 也不跳任何失敗訊息，安靜地繼續試 */
  }

  autoSeqActive = false;                  // 重試額度用完 → 現在才可以下判斷
  rebuildDevices(found, true);            // 確定找不到 → 標記未偵測
  if(timedOut) flashBanner(T('scan_timeout'), false);

  /* ★ 只有【手動】按掃描才累積失敗次數（自動重試不算，否則使用者
   * 根本沒按 3 次就跳警語）。累計到 3 次之後每次失敗都再提醒一次 ——
   * 這時候幾乎可以確定是接線問題，不該只講一次就沉默。 */
  if(!auto && ++scanFails >= 3) flashBanner(T('wiring_hint'), false);
}

let scanTmr=0;

/* ══════════════════════════════════════════════════════════════
   新增串接按鍵（位址指派）
   ──────────────────────────────────────────────────────────────
   為什麼需要這個功能：每顆從控開機都是 0x10（韌體在 ADDR_SLOT 沒有
   有效值時就寫 0x10）。在這之前沒有任何機制寫入 0x12 / 0x14，所以串上
   第三顆會有兩顆同時回應 0x10，取事件時兩顆一起驅動 SDA → CRC 全錯。
   兩片板子看不出問題，第三片一接上就壞。

   指派的死結：要指派的時候兩顆從控的位址是【一樣的】，沒辦法用位址
   說「這一包是給誰的」。韌體改用【實體按壓】區分 —— 主控廣播
   「把自己設成 0x12」，只有當下按著按鍵的那一顆採納。

   ⚠ 流程刻意是「先按開始指派，再按住按鍵」，不是反過來：
     若要求先按住再按確認，按住超過 600ms 就會先觸發長按巨集打出一串字。
     韌體因此持續廣播約 2 秒，讓使用者在這段時間內才去按。

   成功與否不靠總線 ACK（按鍵按著時 ALERT# 一直是低的，沒辦法當 ACK），
   而是廣播結束後自動重掃一次，看新位址有沒有出現 —— 那才是使用者
   真正在意的結果。
   ══════════════════════════════════════════════════════════════ */
/* ★ 必須與韌體的 slaveAddrs[] 完全一致（KEYAtolan_CH552G.ino）。
 * 多一個就多掃一個不存在的位址，少一個就永遠找不到那顆。 */
const SLAVE_ADDRS = [0x10, 0x12, 0x14];
/* 韌體廣播 20 次 × 約 100ms ≈ 2 秒，加上餘裕 */
const ASSIGN_MS = 2600;
let asgBusy = false, asgWait = null;

/* ★ 刻意用半形括號：這個字串在中英文版共用（KEY2 / 0x10 兩種語言都一樣），
 * 用全形「（）」會讓英文版夾中日韓字元 —— _test25 ⑦ 抓到過一次。 */
function addrLabel(a){
  return 'KEY' + (((a - 0x10) >> 1) + 2) + ' (0x' + a.toString(16).toUpperCase() + ')';
}
function addrTaken(a){ return devices.some(d=>d.addr===a && !d.lost); }
function nextFreeAddr(){
  for(const a of SLAVE_ADDRS) if(!addrTaken(a)) return a;
  return 0;
}

function openAssign(){
  if(!isConn){ toast(T('no_hw'),'err'); return; }
  asgBusy = false;
  renderAssign();
  document.getElementById('asgOverlay').classList.add('open');
}
function closeAssign(){
  if(asgBusy) return;                       /* 廣播中不讓關，避免流程被切一半 */
  document.getElementById('asgOverlay').classList.remove('open');
}
function asgBgClick(e){ if(e.target===document.getElementById('asgOverlay')) closeAssign(); }

function renderAssign(msg, kind){
  const free = nextFreeAddr();
  const opts = SLAVE_ADDRS.map(a=>{
    const taken = addrTaken(a);
    return `<option value="${a}"${a===free?' selected':''}>${H(addrLabel(a))}`
         + (taken ? ' — ' + H(T('a_inuse')) : '') + `</option>`;
  }).join('');
  document.getElementById('asgBody').innerHTML = `
    <div style="font-size:12.5px;line-height:1.75;color:var(--muted);margin-bottom:14px">
      ${T('a_why')}
    </div>
    <div class="mode-row" style="margin-bottom:14px">
      <span class="row-lbl">${T('a_target')}</span>
      <select class="f-select" id="asgAddr"${asgBusy?' disabled':''}>${opts}</select>
    </div>
    <ol style="font-size:12.5px;line-height:1.9;padding-left:20px;margin:0 0 16px">
      <li>${T('a_s1')}</li>
      <li>${T('a_s2')}</li>
      <li>${T('a_s3')}</li>
    </ol>
    ${msg ? `<div class="notice ${kind||'notice-todo'}" style="margin-bottom:14px">${msg}</div>` : ''}
    <div style="display:flex;gap:7px;justify-content:flex-end">
      <button class="btn btn-sm" onclick="closeAssign()"${asgBusy?' disabled':''}>${T('a_close')}</button>
      <button class="btn btn-sm btn-p" id="asgGo" onclick="doAssign()"${asgBusy?' disabled':''}>
        ${asgBusy ? T('a_running') : T('a_go')}</button>
    </div>`;
}

/* 韌體回報 0x23 = 廣播已送完 */
function resolveAssign(){ if(asgWait){ const f=asgWait; asgWait=null; f(); } }

async function doAssign(){
  if(asgBusy || !hid) return;
  const addr = parseInt(document.getElementById('asgAddr').value);
  asgBusy = true;
  renderAssign(T('a_press_now'), 'notice-todo');
  logScan('位址指派：廣播「設成 0x'+addr.toString(16)+'」，請使用者現在按住那顆按鍵');

  const p = new Uint8Array(62);
  p[0] = 0x20;          /* bit5 = 位址指派（bit6 是掃描，兩者互斥）*/
  p[1] = addr;          /* 要指派的位址。設定封包裡 p[1] 是欄索引，這條路用不到 */
  try{
    /* 等韌體回報廣播結束；逾時也照樣往下走（重掃才是真正的判定）*/
    const done = new Promise(r=>{ asgWait=r; setTimeout(()=>resolveAssign(), ASSIGN_MS+1200); });
    await hid.sendReport(3, p);
    await done;
  }catch(e){
    asgBusy = false;
    renderAssign(H(T('a_fail_send')+e.message), 'notice-warn');
    logScan('位址指派：送出失敗 '+e.message);
    return;
  }

  /* 廣播結束 → 重掃一次，看新位址有沒有出現 */
  renderAssign(T('a_checking'), 'notice-todo');
  await scanBus();
  await new Promise(r=>setTimeout(r, SCAN_TIMEOUT+300));
  asgBusy = false;
  if(addrTaken(addr)){
    renderAssign(T('a_ok').replace('%s', H(addrLabel(addr))), 'notice-ok');
    logScan('位址指派：成功，0x'+addr.toString(16)+' 已出現在清單');
  }else{
    renderAssign(T('a_nope'), 'notice-warn');
    logScan('位址指派：重掃後仍看不到 0x'+addr.toString(16));
  }
}

function onInput(ev) {
  const d=new Uint8Array(ev.data.buffer);
  /* Report ID 5 = 主控回報。d[0]=0x20 表示掃描結果：
     d[1]=找到幾台、d[2..] = 各 slave 的 I²C 位址 */
  if (ev.reportId===5 && d[0]===0x20) { applyScan(d); return; }
  if (ev.reportId===5 && d[0]===0x21) { resolveFwdAck(d[1]); return; }
  /* ★ 0x22 = 韌體的執行診斷（每次按壓回報一次，見 .ino 的 fireCol）。
   * 這是為了停止「讀程式碼推論 → 被實測否證」的循環：
   * 讓韌體直接說出它數到幾下、選了哪一欄、跑了什麼動作、有沒有走媒體分支。 */
  if (ev.reportId===5 && d[0]===0x22) { logScan(fireDbgText(d)); return; }
  /* 0x23 = 位址指派的廣播已送完（d[2] = 指派的位址）。
   * 它只代表「廣播結束」，不代表有人採納 —— 採納與否由 doAssign 重掃判定。 */
  if (ev.reportId===5 && d[0]===0x23) { resolveAssign(); return; }

  /* ★ Report ID 4 = 媒體鍵（Consumer Control，裝置→主機）。
   * 這頁不需要用它，但【收到它本身就是證據】：
   *   ・有出現 → 韌體確實把媒體鍵報告送出來了，而且格式正確。
   *     那媒體鍵沒作用就不是韌體的問題 —— 而且很可能正是因為
   *     Chrome 開著這個裝置把報告收走了，Windows 才收不到。
   *   ・完全沒出現 → 韌體那一端沒送出（或送錯報告 ID）。
   * 這兩種要修的地方完全不同，而這行不花任何成本就能分辨。
   * （診斷記錄只留最近 12 筆，所以按一下看一次就好。） */
  if (ev.reportId===4){
    const usage = d[0] | (d[1]<<8);
    logScan('收到媒體鍵報告 Report ID 4：usage=0x' + usage.toString(16)
            + (usage ? '（按下）' : '（放開）')
            + ' → 韌體有送出，格式正確');
    return;
  }
  if (ev.reportId!==5) logScan('收到未預期的報告 ID '+ev.reportId);
}

/* 依掃描結果重建裝置清單：KEY #1 = 主控(addr 0)，其餘為 slave */

let diagInfo = null;           // 主控回報的內部狀態（診斷用）

/* ★ 把韌體的 drainDbg 位元翻成人看得懂的話（對應 .ino 的 DBG_* 定義）。
 * 「按 KEY2 沒反應」有四種成因，從外面看完全一樣 —— 這裡直接指出是哪一種，
 * 不必再靠猜。使用流程：重新上電 → 按幾下 KEY2 → 按「掃描串接裝置」→ 看記錄。 */
/* ══════════════════════════════════════════════════════════════════
   韌體執行診斷（Report 0x22）的解讀。

   每一種失敗模式對應一個不同的欄位，所以一次按壓就能定位，不必再猜：
     clicks 數不到 2      → 連擊視窗的問題（韌體 MULTI_TICKS 寫死 250ms，
                            網頁設的「ms」在執行時【沒有被使用】）
     選到欄 = 無          → pickColumn 沒有比對到（按法設定與按壓不符）
     選到的欄不是預期那欄 → 欄的按法設錯，或比對順序有問題
     動作 type/key 不對   → 裝置裡存的不是媒體鍵（設定或儲存的問題）
     走了媒體分支 = 是    → 韌體確實送了 Consumer；那就是 USB/Windows 那端
   ══════════════════════════════════════════════════════════════════ */
function fireDbgText(d){
  const clicks = d[1];
  const isLong = !!(d[2] & 0x01);
  const media  = !!(d[2] & 0x80);
  const idx    = d[3];
  /* ★ d[4]/d[5] = 裝置記憶體裡【實際存的】第 1 個動作的 type / key。
   * 這是把範圍收到最後一個分歧點之後才加回來的：網頁送 type=2 key=0xE9，
   * 而韌體沒走媒體分支 —— 到底是「存進去的不是 2」還是「isMediaUsage 沒認」，
   * 只有這兩個值分得出來。 */
  const sType = d[4], sKey = d[5];
  let s = '韌體執行：數到 ' + clicks + ' 下'
        + (isLong ? '（長按）' : '')
        + '，選到欄 ' + (idx===0xFF ? '【無 → 沒有任何欄符合這個按法】' : (idx+1))
        + (idx===0xFF ? '' :
             '，裝置裡存的第1動作 type=' + sType + actTypeName(sType)
           + ' key=0x' + sKey.toString(16)
           + (isMediaKeyUsage(sKey) ? '（媒體鍵）' : '')
           + (media ? '，✔ 走了媒體(Consumer)分支' : '，✘ 沒有走媒體分支'));
  /* 直接寫結論，不要讓人自己對照 */
  if(idx === 0xFF)
    s += ' → 結論：沒有任何欄符合這次的按法。'
       + (clicks===1 ? '而且只數到 1 下 —— 若你其實按了兩下，就是連擊視窗太短（韌體寫死 250ms，網頁設的 ms 沒有被使用）。'
                     : '請比對上面「送出動作」記錄裡各欄的按法。');
  else if(media)
    s += ' → 結論：韌體確實送出了媒體鍵報告，問題在 USB／Windows 那一端。';
  else if(sType !== ACT_KEY)
    s += ' → 結論：裝置裡存的 type 不是 2（功能鍵/媒體鍵）'
       + '，但網頁送的是 2 → 設定在傳輸或儲存的過程中被改掉了，問題在 applyCfgPacket 那一段。';
  else if(!isMediaKeyUsage(sKey))
    s += ' → 結論：type 是對的，但存進去的 key 不是媒體鍵（網頁送 0xE9/0xEA）'
       + ' → key 這個位元組在傳輸或儲存時被改掉了。';
  else
    s += ' → 結論：type 和 key 在裝置裡都正確，卻沒走 Consumer 分支'
       + ' → 只剩 isMediaUsage 的判斷（例如 USE_MEDIA 沒生效）。';
  return s;
}

/* 這一欄要用哪種按法才會觸發（診斷記錄用）。
 * ★ 為什麼一定要寫出來：媒體鍵查了很多輪，最後發現媒體鍵被設在「欄2/欄3」，
 * 而那兩欄不是「按一下」—— 使用者單按一下觸發的是欄1（字串），
 * 媒體鍵那兩欄根本沒被叫到。記錄只寫「欄2」看不出要怎麼觸發，
 * 於是「設定正確 + 韌體正確 + 卻沒反應」看起來像 bug。 */
function pressName(col){
  const p = col.press;
  return p==='single' ? '按一下'
       : p==='double' ? '按兩下'
       : p==='long'   ? '長按'
       : p==='custom' ? ('連按 '+(col.count||2)+' 下')
       : String(p);
}

/* 動作型別的名稱（診斷記錄用）。與韌體的 ACT_* 一致。 */
function actTypeName(t){
  return t===ACT_STR ? '(字串)' : t===ACT_KEY ? '(功能鍵/媒體鍵)'
       : t===ACT_COMBO ? '(組合鍵)' : '(關閉)';
}
/* 這個 usage 是不是媒體鍵 —— 與韌體 isMediaUsage 的名單【必須一致】。
 * 韌體只對這 7 個走 Consumer Control；其餘 ACT_KEY 走一般鍵盤。 */
function isMediaKeyUsage(u){
  return u===0xCD || u===0xB5 || u===0xB6 || u===0xB7
      || u===0xE9 || u===0xEA || u===0xE2;
}

function drainDbgText(b){
  const on = [];
  if(b & 0x01) on.push('看到 ALERT#');
  if(b & 0x02) on.push('讀回有效框');
  if(b & 0x04) on.push('對方說沒事件');
  if(b & 0x08) on.push('已打字');
  if(b & 0x10) on.push('CRC 全錯');
  if(b & 0x20) on.push('序號重複');
  let verdict;
  if(!(b & 0x01))      verdict = '→ 主控完全沒看到 ALERT#：從控沒拉低，或 ALERT# 那條線／上拉有問題';
  else if(b & 0x08)    verdict = '→ 主控有打字：問題在 USB 鍵盤輸出端，不是總線';
  else if(b & 0x10)    verdict = '→ 讀回的框 CRC 一直錯：SDA 時序或雜訊';
  else if(b & 0x04)    verdict = '→ 框讀對了但從控說沒事件：從控沒把按鍵排進佇列';
  else if(b & 0x20)    verdict = '→ 序號被判成重複，所以故意沒重打（序號同步問題）';
  else                 verdict = '→ 看到 ALERT# 但連一個有效框都沒讀到';
  return '0x' + b.toString(16).padStart(2,'0') + '（' + on.join('、') + '）' + verdict;
}

/* ══════════════════════════════════════════════════════════
   清單與硬體是否對上（#3：換模組要提醒重新套用）
   ──────────────────────────────────────────────────────────
   韌體在每顆板子的 DataFlash 裡存了一個「識別碼」= 它在清單上的位置，
   由「套用設定」時一併寫入（見 writeDev 的 p[33]），掃描時回報回來。

   USB 直連的那顆永遠是清單上的 KEY #1，所以判斷很單純：
     0 / 0xFF → 這顆還沒被套用過設定 → 提示「請設定並套用」
     1        → 就是 KEY #1 → 正常，不用講話
     2 以上   → USB 上這顆其實是清單上的 KEY #n
                → 清單與硬體對不上 → 提示重新套用

   之前用過兩種做法都失敗：
     ・拿韌體存的「從控位址」當識別碼 → 每顆從控都是 0x10，兩顆一樣，分不出來
     ・掃描時帶隨機碼進去指派 → 掃描沒有確認機制，寫入沒生效就每次值都不同
                                → 每次插拔都誤報（就是你回報的狀況）
   現在改走套用設定那條路（有逐包 ACK），並且用清單位置當識別碼，
   不需要 localStorage、不需要隨機碼，也沒有「第一次沒有比對對象」的問題。
   ══════════════════════════════════════════════════════════ */
let boardChanged = false;   // USB 上這顆不是清單的 KEY #1
let boardUnset   = false;   // USB 上這顆還沒被套用過設定
let boardSeen    = 0;       // 最近一次回報的識別碼（診斷用）
let applyLog     = [];      // 最近一次套用失敗的逐包記錄（顯示在提示下方）
/* 逐包失敗訊息共用的標記，方便一次篩出來（不顯示給使用者，會被切掉） */
const APPLY_FAIL = '\u2022 ';

/* ★ 這次瀏覽階段成功套用過的位址。
 * 為什麼需要：網頁【沒有辦法讀回】裝置裡的設定內容（韌體沒有讀取命令）。
 * 韌體只回報「DataFlash 裡有存過設定」和「識別碼」，那不代表裡面的內容
 * 就是畫面上顯示的東西 —— 燒錄程式碼不會清 DataFlash，所以剛燒完的按鍵
 * 身上可能還留著上一版套用的設定，網頁卻對著一個空白畫面說「設定已寫入」。
 * 所以「已寫入」只在這次真的按過套用並成功之後才講。 */
let appliedNow   = {};
/* ★ 每個位址「最後一次真的套用成功」時的設定快照（JSON 字串）。
 * 用來判斷「使用者改過但還沒套用」——
 * 不能拿 cfgStore 比，因為 cfgStore 在每次編輯／切換分頁時就同步更新了，
 * 它代表的是「網頁記住的內容」，不是「按鍵裡的內容」。 */
let appliedSnap  = {};

/* 目前選到的裝置有沒有「改了但還沒套用」的修改。
 * 空白設定不算 —— 那由「還沒有設定」那個提示負責，不要兩個提示同時跳。
 *
 * ★ 基準（appliedSnap）有兩個來源，缺一不可：
 *   ・套用成功時 → 記「剛寫進按鍵的內容」
 *   ・第一次選到某顆裝置時 → 記「從 localStorage 載入的內容」（見 selectDev）
 * 少了第二個就會有實測到的誤報：重新整理網頁後 appliedSnap 是空的，
 * isDirty 對任何非空設定都回 true —— 使用者【什麼都沒改】就被說
 * 「你剛才改過設定」。dirty 追蹤的本意是「這個分頁開著的期間改過沒」，
 * 所以基準就該是「這個分頁載入時看到的內容」。 */
function isDirty(){
  if(selIdx === null || !devices[selIdx] || !edit) return false;
  if(isCfgEmpty(edit)) return false;
  const snap = appliedSnap[devices[selIdx].addr];
  if(snap === undefined) return false;         /* 還沒建立基準 → 不下判斷 */
  return JSON.stringify(cloneCfg(edit)) !== snap;
}

/* 裝置在清單上的顯示名稱。用 getter 掛在每個 device 上（見 rebuildDevices），
 * 切換語言時不必重建清單也會跟著變。 */
function devName(i){ return T('dev_n').replace('%d', String(i + 1)); }

function checkBoard(mark){
  if(mark === undefined || mark === null) return;
  boardSeen = mark;
  if(mark === 0 || mark === 0xFF){        // 還沒套用過設定
    boardUnset   = true;
    boardChanged = false;
    return;
  }
  boardUnset   = false;
  boardChanged = (mark !== 1);            // 主控應該是清單上的 KEY #1
  if(boardChanged) logScan('USB 上這顆的識別碼是 '+mark+'（清單的按鍵'+mark+'）→ 清單與硬體對不上');
}

function applyScan(d){
  /* ★ 只接受「我們正在掃描」時的回報 —— 延遲抵達或非預期的回報一律忽略，
   * 否則它會重寫 lost 旗標，清單就會在「偵測到／未偵測」之間跳動。 */
  if(!scanning) return;

  /* ★ 擋掉「秒回 0 台」的假報告。
   * 舊版韌體的掃描分支會先送一份 found=0、身分記號=0 的空報告，
   * 之後才真的去 ping、再送第二份真報告。而主控 ping 一輪要幾百 ms ——
   * 所以「不到 200ms 就回報 0 台」一定不是真的問過了。
   * 韌體已修，但使用者手上可能還是舊韌體，這裡再擋一層：
   * 每一輪只跳過一份，真報告隨後就會進來。 */
  if(d[1]===0 && !scanSkipped && (Date.now()-scanStart) < 200){
    scanSkipped = true;
    logScan('忽略秒回的空報告（耗時 '+(Date.now()-scanStart)+'ms，等真正的結果）');
    return;                                   /* 不清 scanning，繼續等 */
  }
  scanning = false;

  /* 韌體回報一個功能性位元：DataFlash 裡有沒有存過設定。
   * 網頁用它判斷「這台是不是剛燒完、還沒被灌過設定」。 */
  if(d[6]!==undefined) diagInfo = { saved : !!(d[6] & 0x40) };
  if(d[7]!==undefined) checkBoard(d[7]);      /* 換模組偵測（見 checkBoard）*/
  /* 韌體回報的取事件狀態（drainDbg）。0 = 沒回報。
   * （這裡曾經還解讀 d[3]/d[4]「實際讀回的位元組」—— 那組一次性診斷
   *   已經完成任務並從韌體移除，見 .ino 裡 dbgB0 的註解。） */
  if(d[5]) logScan('主控取事件狀態：' + drainDbgText(d[5]));

  const n = d[1] || 0, addrs = [];
  for(let i=0; i<n && i<6; i++){ const a = d[2+i]; if(a) addrs.push(a); }

  /* 結果交給唯一出口處理（重試／標記／警語的規則都在那裡） */
  onScanDone(addrs, scanIsAuto);
}
/* 等待主控回報 0x21（轉發結果）。★ 這個陣列的宣告不能刪 ——
 * 少了它，waitFwdAck 會在 Promise executor 裡丟 ReferenceError，
 * 變成 rejected promise，結果每次「套用設定」都失敗。 */
let fwdWaiters = [];

function waitFwdAck(ms){
  return new Promise(res=>{
    const w={res, t:setTimeout(()=>{
      fwdWaiters=fwdWaiters.filter(x=>x!==w); res(null);
    }, ms)};
    fwdWaiters.push(w);
  });
}
/* code: 0 = 失敗、1 = 成功、2 = 總線忙（韌體 busSendAck 的回傳值）。
 * ★ busy 要和 fail 分開：使用者按著 KEY2 的同時按套用，那顆從控會一直
 *   拉低 ALERT#，主控送不出去。那不是壞掉，等一下就好 —— 見 sendPkt。 */
function resolveFwdAck(code){
  const w=fwdWaiters.shift();
  if(w){ clearTimeout(w.t); w.res({ ok: code===1, busy: code===2 }); }
}

/* 送一包並等 ACK；遇到「總線忙」自動重試。
 * 為什麼放在這裡而不是讓使用者重按：忙的原因就是他手還按在按鍵上，
 * 而那是很自然的操作（一邊試按一邊改設定）。整批套用因此失敗、
 * 還顯示「主控沒回應」讓人去查接線 —— 那是最糟的引導。 */
const FWD_BUSY_TRIES = 6;          /* 6 × 300ms ≈ 2 秒，夠使用者放開手 */
async function sendPkt(p, tag){
  for(let attempt=0; attempt<=FWD_BUSY_TRIES; attempt++){
    const ack = waitFwdAck(2500);
    await hid.sendReport(3, p);
    const r = await ack;
    if(!r || !r.busy) return r;                  /* 成功或真的失敗 → 交給呼叫者 */
    if(attempt === 0) logScan('總線忙（有按鍵事件待處理）→ 自動重試：' + tag);
    await new Promise(res=>setTimeout(res, 300));
  }
  /* ★ 訊息要講「該怎麼辦」。原本只寫「持續忙碌，放棄」，使用者不知道
   * 那是自己手還按在按鍵上造成的。
   * （為什麼不自動解決：從控要等主控把事件取走才會放開 ALERT#，而主控在
   *   處理設定封包時 busDrainEvents 會因為 cfgPending 而直接 return ——
   *   要繞過那個保護才行，風險比這個情境的價值高。所以選擇講清楚。） */
  logScan(APPLY_FAIL + T('busy_give_up') + '：' + tag);
  return { ok:false, busy:true };
}

let pktTotal=0, pktDone=0, fwdFail=0, busyDev=null;

/* boardId = 這台在清單上的位置（1 起算）。跟著設定寫入裝置，見 p[33]。 */
async function writeDev(addr,cfg,boardId){
  if(!hid)return;
  const enc=new TextEncoder();
  let first=true;
  pktTotal=cfg.reduce((n,c)=>n+c.actions.length,0);
  pktDone=0; fwdFail=0; busyDev=addr; renderDevList();
  try{
  for(let ci=0; ci<cfg.length; ci++){
    const col=cfg[ci];
    const na=col.actions.length;
    const count=col.count||1;
    for(let ai=0; ai<na; ai++){
      const a=col.actions[ai];
      const p=new Uint8Array(62);
      let flags=0;
      if(first) flags|=0x01;                                   // 第一包：裝置先清空
      if(ai===na-1) flags|=0x02;                               // 本欄最後動作
      if(ci===cfg.length-1 && ai===na-1) flags|=0x04;          // 全部收完
      p[0]=flags;
      p[1]=ci;
      p[2]=PRESS_CODE[col.press]??0;
      p[3]=count;
      /* ★ [4..5] = RGB565 顏色（亮度已經乘進去）。
       * 這兩個位元組原本是「自訂秒數」的 timingMs，那個功能移除後留成
       * reserved —— 現在正好給 RGB 用，所以 62 bytes 的封包格式從頭到尾
       * 沒有變過。韌體端見 Column.rgb565。 */
      /* ★ 單色模式就送 0 —— 韌體的 rgbWrite(0) 就是全黑（RGB 不亮），
       * 所以「單色／多色」不需要額外的位元組、不動 DataFlash 佈局、
       * 也不必再換 FLASH_MAGIC。P3.2 那顆單色燈兩種模式都照亮。 */
      { const rp = (col.rgbOn===false) ? [0,0] : rgbPack(col.rgb, col.bri);
        p[4]=rp[0]; p[5]=rp[1]; }
      p[6]=ai;
      p[7]=a.type||0; p[8]=a.mod||0; p[9]=a.key||0;
      const d=a.delay||0; p[10]=d&0xff; p[11]=(d>>8)&0xff;
      /* ★ 把「實際送出去的動作」寫進診斷記錄。
       * 為什麼需要：媒體鍵查到最後，韌體整條鏈（USE_MEDIA、isMediaUsage、
       * macroKey、Consumer_press、reportID==4 分支、HID 描述子）逐行都正確，
       * 但按下去連一個 Report 4 都沒送出 —— 那就只剩「裝置裡存的根本不是
       * 媒體鍵」這一種可能。而在此之前，網頁送了什麼完全看不到。
       * 現在套用一次就能確認：媒體鍵必須是 type=2 且 key 落在 0xB5~0xEA。 */
      logScan('送出動作 欄'+(ci+1)+'【'+pressName(col)+'】/動作'+(ai+1)
              + ' type=' + (a.type||0) + actTypeName(a.type)
              + ' key=0x' + (a.key||0).toString(16)
              + (isMediaKeyUsage(a.key) ? '（媒體鍵）' : '')
              + ' mod=0x' + (a.mod||0).toString(16)
              + ' 字串長度=' + (a.str||'').length);
      if(a.type===ACT_COMBO){
        /* ★ 組合鍵：字串欄位改裝「第 2 個之後的主鍵」（見 macroCombo）。
         *
         * 直接寫原始位元組，不經過 TextEncoder。
         * ⚠ 我一開始的理由是「usage 0xE9 會被編成 2 個 UTF-8 位元組」——
         *   那個理由其實【不成立】：鍵盤 usage 的有效範圍是 0x04~0x65，
         *   全部小於 0x80，UTF-8 編碼後仍是 1 個位元組。紅燈驗證時發現
         *   換成 TextEncoder 版本測試照樣通過，才確認這一點。
         *   保留直接寫位元組是因為它【語意正確】（這裡本來就不是文字），
         *   而且日後若把媒體鍵那類 >0x7F 的 usage 放進組合鍵才不會出錯。
         *   _test26 會驗證鍵盤圖上的每個 usage 都 < 0x80，這個前提有人守。 */
        const ex=(Array.isArray(a.ext)?a.ext:[]).filter(k=>k>0).slice(0,KB_MAX_KEYS-1);
        p[12]=ex.length; ex.forEach((k,i)=>{ p[13+i]=k & 0xff; });
      }else{
        /* 只送可列印 ASCII，並以 bytes 截斷 —— 與輸入端 setStr 同一套規則。
         * 這裡再過一次是防守性的：cfgStore 可能來自舊版 localStorage。 */
        const s=enc.encode((a.str||'').replace(/[^\x20-\x7E\n\t]/g,'').slice(0,FW_STR_MAX));
        p[12]=s.length; s.forEach((x,i)=>{ if(i<20) p[13+i]=x; });
      }
      // 每個按法的 LED 連動設定
      p[37]=addr & 0xff;               // ★ 目標裝置位址（0=主控自己）
      /* ★ p[33] 低 4 bit = LED 模式，高 4 bit = 板子識別碼（清單位置 1~15）。
       * 封包 p[0..36] 已經全滿沒有空位元組，而 ledMode 只用到 0~3，高半邊是空的。
       * 識別碼跟著設定一起寫進裝置的 DataFlash，之後掃描時回報回來，
       * 網頁就能判斷「USB 上這顆是不是清單上的 KEY #1」。 */
      p[33]=((col.ledMode===undefined?1:col.ledMode) & 0x0F) | ((boardId & 0x0F) << 4);
      p[34]=col.ledTimes||1;
      const lm=col.ledMs||500; p[35]=lm&0xff; p[36]=(lm>>8)&0xff;
      if(addr){
        /* ★ 灌到 slave：主控轉發一包要約 470ms，而韌體中斷裡有
         * `if (cfgPending) return;`，太快送就會被整包丟掉。
         * 所以等主控回報（Report ID 5, [0]=0x21）再送下一包。
         * sendPkt 另外處理「總線忙」的自動重試（使用者按著按鍵時）。 */
        const r=await sendPkt(p, '第 '+(pktDone+1)+'/'+pktTotal+' 包 → 0x'+addr.toString(16));
        if(!r || !r.ok){
          fwdFail++;
          /* ★ 記下是第幾包失敗。之前只累加次數，出問題時無法判斷是
           * 「第一包就不通」（接線／位址問題）還是「後面某一包才掉」
           * （時序問題，例如對方正忙著寫 DataFlash 聽不到重試）。 */
          logScan(APPLY_FAIL+'轉發失敗：第 '+(pktDone+1)+'/'+pktTotal+' 包（addr 0x'
                  + addr.toString(16) + '，' + (r ? '主控回報失敗' : '主控沒回應') + '）');
        }
      }else{
        /* ★ 主控自己也要等 ACK，不能用固定延遲。
         * 主控可能正忙（從控掛住時 busDrainEvents 會佔住主迴圈近 600ms），
         * 固定 30ms 的話後續封包會被中斷裡的 `if (cfgPending) return;` 丟掉 ——
         * 症狀是「4 個動作只有第 1 個生效」。韌體現在對本機封包也回報 0x21。 */
        const r=await sendPkt(p, '第 '+(pktDone+1)+'/'+pktTotal+' 包（本機）');
        if(!r || !r.ok){
          fwdFail++;
          logScan(APPLY_FAIL+'本機寫入失敗：第 '+(pktDone+1)+'/'+pktTotal+' 包（主控沒回應）');
        }
      }
      first=false;
      pktDone++; renderDevList();
    }
  }
  }finally{ busyDev=null; pktTotal=0; renderDevList(); }
  if(fwdFail) throw new Error(T('fwd_fail').replace('%d',String(fwdFail)));
}

/* ★ ext（額外主鍵）也要進快照，否則「加了一個主鍵」不會被判成未套用。
 * 這正是延遲欄位那個 bug 的同一課：快照漏了欄位＝那個欄位的修改看不見。 */
function cpSlot(sl){return{type:sl.type,str:sl.str,key:sl.key,mod:sl.mod,
                           ext:(Array.isArray(sl.ext)?sl.ext.slice():[]),
                           delay:sl.delay||0};}

   Device list UI
   ════════════════════════════════════════════════════════════ */
function renderDevList(){
  const el=document.getElementById('devList');
  if(!devices.length){
    el.innerHTML=`<div class="empty-msg">${T('no_dev').replace('\n','<br>')}</div>`;
    return;
  }
  el.innerHTML=devices.map((d,i)=>`
    <div class="dev-item${i===selIdx?' active':''}${busyDev===d.addr?' writing':''}" onclick="selectDev(${i})">
      <div class="dev-name">
        <svg class="kb-icon" viewBox="0 0 24 17" width="22" height="16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <rect x=".5" y=".5" width="23" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/>
          <rect x="2"   y="2.5" width="3.5" height="3" rx=".8"/>
          <rect x="6.5" y="2.5" width="3.5" height="3" rx=".8"/>
          <rect x="11"  y="2.5" width="3.5" height="3" rx=".8"/>
          <rect x="15.5" y="2.5" width="3.5" height="3" rx=".8"/>
          <rect x="19.5" y="2.5" width="2"   height="3" rx=".8"/>
          <rect x="2"   y="7" width="3.5" height="3" rx=".8"/>
          <rect x="6.5" y="7" width="3.5" height="3" rx=".8"/>
          <rect x="11"  y="7" width="3.5" height="3" rx=".8"/>
          <rect x="15.5" y="7" width="6"   height="3" rx=".8"/>
          <rect x="5"   y="12" width="14" height="3" rx=".8"/>
        </svg>
        ${H(d.name)}
      </div>
      <div class="dev-meta">${T('addr')}: 0x${d.addr.toString(16).padStart(2,'0').toUpperCase()}</div>
      ${d.disc?`<div class="dev-lost">⚠ ${T('conn_lost')}</div>`:''}
      ${busyDev===d.addr&&pktTotal?`<div class="dev-prog">${T('writing')} ${pktDone}/${pktTotal}</div>`:''}
      ${scanning&&d.addr!==0?`<div class="dev-empty">${T('checking')}</div>`
        :d.lost?`<div class="dev-lost">⚠ ${T('not_found')}</div>`:''}
      ${d.cfg&&isCfgEmpty(d.cfg)?`<div class="dev-empty">${T('not_set')}</div>`:''}
      ${d.addr!==0?`<button class="dev-rm" title="${T('rm_title')}"
          onclick="removeDev(${d.addr}, event)">\u00d7</button>`:''}
    </div>`).join('')
    + (scanning?`<div class="dev-busy"><span class="spin"></span>${T('scanning')}</div>`:'');

  /* ★ 提示與按鈕都在滾動區外面，這裡只負責填內容。
   * 一次只講【一件】事。
     * 上一版四個框同時跳（沒找到裝置／還沒儲存設定／換了模組／設定未保存）
     * 再加一個滿版橫幅 —— 使用者看到的是一堆紅字，反而不知道要做什麼。
   * 而且 boardChanged 當時沒被 autoSeqActive 壓住，掃描還在跑就跳出來。 */
  const btn = document.getElementById('scanBtn');
  if(btn){ btn.disabled = scanning || !isConn; }
  const akb = document.getElementById('addKeyBtn');
  if(akb){ akb.disabled = scanning || !isConn || isDemo || asgBusy; }

  /* ★ 掃描歷程曾經整個從畫面移除（「診斷用途完成、不佔畫面」）——
   * 結果就是：我請使用者去看「主控取事件狀態」那一行，而那行根本畫不出來。
   * 現在改成【預設收起、按一下展開】的折疊區：平常只有一行小字，
   * 不佔空間也不會擋到掃描按鈕；要診斷時點開就看得到完整記錄。 */
  const nt = document.getElementById('devNotice');
  if(nt){
    nt.innerHTML = scanLog.length
      ? `<details class="scan-log"${scanLogOpen?' open':''}>
           <summary>${T('log_title')}（${scanLog.length}）</summary>
           <div class="scan-log-h">
             <button class="log-copy" id="logCopyBtn"
                     onclick="copyScanLog(event)">${T('log_copy')}</button>
           </div>
           <div class="scan-log-b">${scanLog.map(H).join('<br>')}</div>
         </details>`
      : '';
    const dt = nt.querySelector('details');
    /* 記住展開狀態 —— 否則每次自動掃描重繪就會把使用者打開的記錄合起來。 */
    if(dt) dt.addEventListener('toggle', ()=>{ scanLogOpen = dt.open; });
  }
}

function selectDev(i){
  /* ★ 切換前先把目前的編輯內容存回「原本那台」，
   * 否則在 KEY1/KEY2 之間切換會把改到一半的設定丟掉。 */
  if(selIdx!==null && selIdx!==i && devices[selIdx] && edit){
    const c = cloneCfg(edit);
    devices[selIdx].cfg = c;
    cfgStore[devices[selIdx].addr] = c;      /* ★ 一併寫回倉庫，才不會被下次掃描還原 */
    saveStore();
  }

  selIdx=i;
  const d=devices[i];
  if(!d.cfg) d.cfg = cfgStore[d.addr] = mkCfg();   /* 保險：不該發生 */
  edit = cloneCfg(d.cfg);
  /* ★ 第一次選到這顆 → 以「載入時的內容」建立 dirty 基準（見 isDirty）。
   * 只建一次：之後切換分頁回來時，上面已把編輯內容存回 cfgStore，
   * 若在這裡重建基準，「改了還沒套用」的狀態就會被洗掉。 */
  if(!(d.addr in appliedSnap)) appliedSnap[d.addr] = JSON.stringify(edit);
  renderDevList(); renderCfg();
}
