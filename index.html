/* ★ 字串輸入：當場只接受可列印 ASCII、Tab、換行。
 * 為什麼不能等到套用才擋：
 *   ・韌體只輸出 ASCII，中文一定被丟掉
 *   ・封包的字串欄位是固定 20 bytes，而中文一個字 3 bytes ——
 *     用 JS 的字元數截斷再 UTF-8 編碼，會在第 20 個 byte 中間切斷，
 *     裝置收到半段 UTF-8，行為無法預期
 * 所以在來源就擋掉，計數也直接用 bytes（限制成 ASCII 之後字元數 = bytes 數）。
 * 被過濾掉的字會即時消失，使用者馬上知道不支援，不用等到按套用。 */
function setStr(ci, ai, el){
  const raw   = el.value;
  const clean = raw.replace(/[^\x20-\x7E\n\t]/g, '').slice(0, FW_STR_MAX);
  if(clean !== raw){
    const pos = Math.min(el.selectionStart, clean.length);
    el.value = clean;
    try{ el.setSelectionRange(pos, pos); }catch(e){}
    toast(T('ascii_only'), 'err');
  }
  edit[ci].actions[ai].str = clean;
  const hint = el.nextElementSibling;
  if(hint) hint.textContent = strBytes(clean) + '/' + FW_STR_MAX + ' bytes';
  /* ★ 打字時【不能】呼叫 renderCfg —— 整塊重繪會讓輸入框失焦，字就打不下去。
   * 所以只更新受影響的那兩處（提示區 + 套用按鈕），其餘 DOM 不動。 */
  syncDirtyUI();
}

/* ══════════════════════════════════════════════════════════════
   ★ 所有「不重繪畫面」的修改都必須走這裡的具名 setter
   ──────────────────────────────────────────────────────────────
   實測到的 bug：改「延遲後執行下一步」的毫秒數，套用按鈕不會亮綠燈。

   原因不是 isDirty 或快照有問題（cpSlot 確實有複製 delay）——
   而是那個輸入框的 oninput 是【行內賦值】：
       oninput="edit[ci].actions[ai].delay = ..."
   它改了資料，但既沒有 renderCfg()（會整塊重繪、順便更新提示與按鈕），
   也沒有 syncDirtyUI()。資料變了，畫面完全不知道。

   ⚠ 不是只有延遲壞掉 —— 同一種寫法一共有 5 處：
       延遲毫秒、連按次數、功能鍵選單、LED 次數、LED 毫秒
   全部改成具名函式並在最後呼叫 syncDirtyUI()。
   行內賦值最省事，但它繞過了「改了要通知畫面」這個約定；
   之後要再加欄位，請一律加 setter，不要再寫行內賦值。
   （_test26 會擋住 renderActCard / renderPressCol / renderLedBlock
     裡出現 `edit[...]=` 這種行內賦值。）
   ══════════════════════════════════════════════════════════════ */
function setDelay(ci,ai,el){
  edit[ci].actions[ai].delay = Math.max(0, Math.min(FW_DELAY_MAX, parseInt(el.value)||0));
  syncDirtyUI();
}
function setCount(ci,el){
  edit[ci].count = Math.max(2, Math.min(20, parseInt(el.value)||2));
  syncDirtyUI();
}
function setFKey(ci,ai,el){
  edit[ci].actions[ai].key = parseInt(el.value)||0;
  syncDirtyUI();
}

/* 只更新「改了但還沒套用」相關的兩處 UI，不重繪整個面板。
 * 供打字這種「不能重繪」的情境使用；其他 mutation 走 renderCfg 自然會更新。 */
function syncDirtyUI(){
  const na = document.getElementById('noticeArea');
  if(na) na.innerHTML = noticeHtml() + applyLogHtml();
  /* ★ 必須用 id 抓，不能用 querySelector('.btn-p')：
   * 頁面上有三個 .btn-p（連線按鈕、組合鍵對話框的確認、套用設定），
   * querySelector 會抓到 DOM 最前面那個 —— 也就是【連線按鈕】，
   * 於是綠燈會亮在錯的按鈕上。 */
  const btn = document.getElementById('applyBtn');
  if(btn){
    const alert = needAttention(), dirty = !alert && isDirty();
    btn.classList.toggle('btn-alert', alert);
    btn.classList.toggle('btn-dirty', dirty);
  }
}

/* 每個按法的 LED 連動設定 */
function setLedMode(ci,m){ edit[ci].ledMode=m; renderCfg(); }
/* ★ 這兩個原本沒有呼叫 syncDirtyUI —— 改 LED 次數／毫秒一樣不會亮綠燈
 * （和延遲欄位同一個 bug，只是使用者先遇到延遲那個）。 */
function setLedTimes(ci,v){ edit[ci].ledTimes=Math.max(1,Math.min(20,parseInt(v)||1)); syncDirtyUI(); }
function setLedMs(ci,v){ edit[ci].ledMs=Math.max(50,Math.min(9999,parseInt(v)||500)); syncDirtyUI(); }

/* ★ RGB 的兩個 setter 一樣要呼叫 syncDirtyUI（見 setDelay 上方的說明）——
 * 改顏色不重繪整個面板（會讓色盤失焦），所以只更新提示與套用按鈕。
 * 預覽點要自己更新，因為它不在重繪範圍內。 */
function setRgb(ci,hex){
  edit[ci].rgb = hexToRgb(hex);
  refreshRgbDot(ci);
  syncDirtyUI();
}
function setBri(ci,v){
  edit[ci].bri = Math.max(1, Math.min(100, parseInt(v)||RGB_BRI_DEF));
  refreshRgbDot(ci);
  syncDirtyUI();
}
/* 預覽點顯示的是【眼睛看到的樣子】，不是送出去的數值。
 * ★ 用 k^(1/2.2) 而不是 k：LED 的光輸出是線性的 k 倍，但螢幕是 sRGB，
 *   要換算回 sRGB 才能讓預覽和實物看起來一致。
 *   （直接乘 k 的話預覽會比實物暗很多，60% 看起來像 20%。） */
function rgbScaled(c, bri){
  const k = Math.max(0,Math.min(100, bri===undefined?RGB_BRI_DEF:bri))/100;
  const p = Math.pow(k, 1/GAMMA);
  return { r:Math.round((c&&c.r||0)*p), g:Math.round((c&&c.g||0)*p), b:Math.round((c&&c.b||0)*p) };
}
function refreshRgbDot(ci){
  const col = document.getElementById('pc'+ci);
  const dot = col && col.querySelector('.rgb-dot');
  if(dot) dot.style.background = rgbToHex(rgbScaled(edit[ci].rgb, edit[ci].bri));
}

/* ══════════════════════════════════════════════════════════════
   顏色對話框：色輪 + RGB 數值 + HEX
   ──────────────────────────────────────────────────────────────
   為什麼做成對話框而不是直接放在按法欄裡：按法欄很窄（四欄並排），
   色輪 + 三個 RGB 欄位 + HEX 欄位塞不進去。和組合鍵挑選器一樣的做法。

   色輪 = 12 個色相 × 5 圈明度，最外圈全飽和、往內漸漸混白、圓心純白。
   用 SVG 的環形扇形路徑產生，每一塊都可以點。
   ══════════════════════════════════════════════════════════════ */
const WHEEL_HUES = 12, WHEEL_RINGS = 5;

/* HSV(h 0~360, s=1, v=1) → RGB。只需要 s=v=1 的情形，所以寫得很短。
 * ⚠ 公式是 1 − clamp(min(k, 4−k, 1))，那個「1 −」不能漏 ——
 *   漏掉的話整個色輪會反相（色相 0 變成青色而不是紅色）。
 *   我第一版就漏了，靠 wheelColor(0,0) 應該是 #ff0000 這個檢查抓到的。 */
function hueToRgb(h){
  const c = (n) => {
    const k = ((h/60) + n) % 6;
    return Math.round(255 * (1 - Math.max(0, Math.min(k, 4-k, 1))));
  };
  return { r:c(5), g:c(3), b:c(1) };
}
/* 往白色混：t=0 原色、t=1 純白 */
function tint(c, t){
  return { r:Math.round(c.r+(255-c.r)*t),
           g:Math.round(c.g+(255-c.g)*t),
           b:Math.round(c.b+(255-c.b)*t) };
}
/* 色輪上第 (hi, ri) 塊的顏色。ri=0 是最外圈（全飽和）。 */
function wheelColor(hi, ri){
  return tint(hueToRgb(hi * (360/WHEEL_HUES)), ri / WHEEL_RINGS);
}

/* 環形扇形的 SVG path */
function arcPath(cx, cy, r0, r1, a0, a1){
  const P = (r,a)=>[cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const [x0,y0]=P(r1,a0), [x1,y1]=P(r1,a1), [x2,y2]=P(r0,a1), [x3,y3]=P(r0,a0);
  const f = (n)=>n.toFixed(2);
  return `M${f(x0)},${f(y0)} A${f(r1)},${f(r1)} 0 0 1 ${f(x1)},${f(y1)}`
       + ` L${f(x2)},${f(y2)} A${f(r0)},${f(r0)} 0 0 0 ${f(x3)},${f(y3)} Z`;
}

function wheelSvg(){
  /* ★ 中央白色圓縮小（0.30 → 0.16）。原本佔掉將近三分之一半徑，
   * 色環被壓得很細。縮小之後每一圈都更寬、更好點。 */
  const S=132, c=S/2, rMax=c-2, rMin=rMax*0.16;
  const step=(Math.PI*2)/WHEEL_HUES, half=step/2;
  let out=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" class="cw-svg">`;
  for(let ri=WHEEL_RINGS-1; ri>=0; ri--){
    const r1 = rMin + (rMax-rMin)*(WHEEL_RINGS-ri)/WHEEL_RINGS;
    const r0 = rMin + (rMax-rMin)*(WHEEL_RINGS-ri-1)/WHEEL_RINGS;
    for(let hi=0; hi<WHEEL_HUES; hi++){
      const a0 = hi*step - half - Math.PI/2, a1 = a0 + step;
      const col = wheelColor(hi, ri);
      out += `<path d="${arcPath(c,c,r0,r1,a0,a1)}" fill="${rgbToHex(col)}"`
           + ` onclick="pickWheel(${col.r},${col.g},${col.b})"/>`;
    }
  }
  /* 圓心純白 */
  out += `<circle cx="${c}" cy="${c}" r="${rMin.toFixed(2)}" fill="#ffffff"`
       + ` onclick="pickWheel(255,255,255)"/>`;
  return out + '</svg>';
}

/* ══════════════════════════════════════════════════════════════
   ★ 顏色挑選器改成【內嵌折疊】，不是跳出對話框
   ──────────────────────────────────────────────────────────────
   原本做成 modal 的理由是「按法欄很窄，塞不進去」。但跳出視窗會遮住
   其他欄，調色時看不到旁邊在幹什麼 —— 改回內嵌，點色塊展開、
   在色輪上選好顏色就自動收折。

   ⚠ 只有【點色輪】會自動收折。R/G/B 與 HEX 欄位打字時不能收折，
     也不能重繪（會失焦，色碼打不完）—— 那兩種輸入走 syncColorFields()
     只更新受影響的節點，和 setStr / setDelay 同一套做法。
   ══════════════════════════════════════════════════════════════ */
let pickOpen = null;              /* 目前展開的是哪一欄（null = 全收折）*/
let colTmp   = { r:0, g:255, b:0 };

function togglePick(ci){
  pickOpen = (pickOpen === ci) ? null : ci;
  if(pickOpen !== null){
    const c = edit[ci].rgb || RGB_DEF;
    colTmp = { r:c.r|0, g:c.g|0, b:c.b|0 };
  }
  renderCfg();
}

/* 色輪、三個數值欄、HEX 欄共用同一份 colTmp。
 * skip = 正在打字的那個欄位 id，不要回寫它（會跳游標）。 */
function syncColorFields(skip){
  const set=(id,v)=>{ const el=document.getElementById(id); if(el && skip!==id) el.value=v; };
  set('cR', colTmp.r); set('cG', colTmp.g); set('cB', colTmp.b);
  set('cHex', rgbToHex(colTmp).toUpperCase());
  if(pickOpen === null) return;
  /* 即時把顏色寫回設定 —— 內嵌模式沒有「確認」按鈕，所見即所得。 */
  edit[pickOpen].rgb  = { r:colTmp.r, g:colTmp.g, b:colTmp.b };
  edit[pickOpen].rgbOn = true;
  const bri = (edit[pickOpen].bri===undefined) ? RGB_BRI_DEF : edit[pickOpen].bri;
  const sw = document.getElementById('sw'+pickOpen);
  if(sw) sw.style.background = rgbToHex(colTmp);
  const dot = document.getElementById('dot'+pickOpen);
  if(dot) dot.style.background = rgbToHex(rgbScaled(colTmp, bri));
  const bulb = document.getElementById('bulb'+pickOpen);
  if(bulb) bulb.style.color = rgbToHex(colTmp);
  syncDirtyUI();
}
/* 點色輪 → 設定顏色並自動收折 */
function pickWheel(r,g,b){
  colTmp={r,g,b};
  syncColorFields();
  pickOpen = null;
  renderCfg();
}
function setColNum(ch, el){
  colTmp[ch] = Math.max(0, Math.min(255, parseInt(el.value)||0));
  syncColorFields('c'+ch.toUpperCase());
}
function setColHex(el){
  /* 邊打邊解析：不足 6 碼就先不動（否則 #0 會被當成黑色把數值欄清掉）*/
  const t = String(el.value||'').trim();
  if(!/^#?[0-9a-f]{6}$/i.test(t)) return;
  colTmp = hexToRgb(t);
  syncColorFields('cHex');
}
/* 單色 ↔ 多色。單色不是「關掉燈」—— P3.2 那顆照亮，只是 RGB 不亮。 */
function toggleRgbOn(ci){
  edit[ci].rgbOn = (edit[ci].rgbOn===false);
  if(edit[ci].rgbOn===false && pickOpen===ci) pickOpen = null;
  renderCfg();
}

/* 單色／多色的滑動開關（使用者要求換掉原本的燈泡圖示）。
 * 純 CSS，不用 SVG —— 開關本體就是一顆圓角矩形加一個會滑動的圓點。 */
function switchHtml(ci, on){
  return `<button class="sw-toggle${on?' on':''}" onclick="toggleRgbOn(${ci})"
        role="switch" aria-checked="${on?'true':'false'}"
        title="${A(T('rgb_mode_hint'))}"><span class="sw-knob"></span></button>
      <span class="sw-lbl">${on ? T('rgb_multi') : T('rgb_mono')}</span>`;
}

/* 該按法的 LED 區塊（放在每個按法欄的下方） */
function renderLedBlock(ci){
  const c=edit[ci];
  const m=(c.ledMode===undefined)?LED_BLINK:c.ledMode;
  const opt=(v,l)=>`<option value="${v}"${m===v?' selected':''}>${H(l)}</option>`;
  let extra='';
  if(m===LED_BLINK){
    extra=`<span class="led-param">
             <input class="timing-inp" style="width:44px" type="number" min="1" max="20"
               value="${c.ledTimes||1}" oninput="setLedTimes(${ci},this.value)">
             <span class="timing-unit">${T('led_times')}</span>
           </span>`;
  } else if(m===LED_SOLID){
    extra=`<span class="led-param">
             <input class="timing-inp" type="number" min="50" max="9999" step="50"
               value="${c.ledMs||500}" oninput="setLedMs(${ci},this.value)">
             <span class="timing-unit">ms</span>
           </span>`;
  }
  /* RGB 只有在燈會亮的時候才有意義 —— LED_OFF 就不顯示，
   * 免得使用者調了顏色卻發現燈根本不亮。 */
  const rgb = c.rgb || RGB_DEF;
  const bri = (c.bri===undefined) ? RGB_BRI_DEF : c.bri;
  const on  = (c.rgbOn !== false);
  const open = (pickOpen === ci) && on;
  /* ★ 燈泡圖示【本身】就是單色／多色的切換鈕，而且圖示會跟著變：
   *   多色 = 實心並染上目前的顏色（有光線）、單色 = 空心灰。 */
  const rgbRow = (m===LED_OFF) ? '' : `
      <div class="led-row" style="margin-top:6px">
        ${switchHtml(ci, on)}
        ${on ? `
        <button class="rgb-sw${open?' open':''}" id="sw${ci}" onclick="togglePick(${ci})"
                title="${A(T('rgb_hint'))}" style="background:${rgbToHex(rgb)}"></button>
        <input class="timing-inp" style="width:50px" type="number" min="1" max="100"
               value="${bri}" oninput="setBri(${ci},this.value)" title="${A(T('rgb_bri'))}">
        <span class="timing-unit">%</span>
        <span class="rgb-dot" id="dot${ci}" style="background:${rgbToHex(rgbScaled(rgb,bri))}"
              title="${A(T('rgb_preview').replace('%s', rgbToHex(rgbScaled(rgb,bri)).toUpperCase()))}"></span>` : ''}
      </div>
      ${open ? `
      <div class="cw-panel">
        <div class="cw-wrap">
          <div>${wheelSvg()}</div>
          <div class="cw-side">
            <div class="cw-fields">
              <label>R<input class="timing-inp" id="cR" type="number" min="0" max="255"
                             value="${colTmp.r}" oninput="setColNum('r',this)"></label>
              <label>G<input class="timing-inp" id="cG" type="number" min="0" max="255"
                             value="${colTmp.g}" oninput="setColNum('g',this)"></label>
              <label>B<input class="timing-inp" id="cB" type="number" min="0" max="255"
                             value="${colTmp.b}" oninput="setColNum('b',this)"></label>
              <label>HEX<input class="timing-inp" id="cHex" style="width:74px;text-align:left"
                               maxlength="7" spellcheck="false"
                               value="${rgbToHex(colTmp).toUpperCase()}"
                               oninput="setColHex(this)"></label>
            </div>
            <div class="cw-tip">${T('rgb_wheel_tip')}</div>
          </div>
        </div>
      </div>` : ''}`;
  return `
    <div class="led-block">
      <div class="led-title">💡 ${T('led_link')}</div>
      <div class="led-row">
        <select class="f-select" style="flex:1 1 90px" onchange="setLedMode(${ci},parseInt(this.value))">
          ${opt(LED_OFF,T('led_off'))}${opt(LED_BLINK,T('led_blink'))}
          ${opt(LED_SOLID,T('led_solid'))}
        </select>
        ${extra}
      </div>
      ${rgbRow}
    </div>`;
}

function renderPressCol(ci){
  const col=edit[ci];
  // 護鎖：其他欄已使用的按法（custom 除外）不可再選
  const usedElsewhere = edit.filter((c,i)=>i!==ci).map(c=>c.press);
  const pressSel = PRESS_OPTS().map(o=>{
    const taken = o.v!=='custom' && usedElsewhere.includes(o.v) && col.press!==o.v;
    return `<option value="${o.v}"${col.press===o.v?' selected':''}${taken?' disabled':''}>${H(o.l)}${taken?' '+T('press_taken'):''}</option>`;
  }).join('');
  const canDelCol = edit.length>1;
  return `
    <div class="press-col-wrap">
    <div class="press-col" id="pc${ci}">
      <div class="press-head">
        <span class="press-ico">${PRESS_ICON[col.press]||'👆'}</span>
        <select class="f-select press-sel" onchange="setPress(${ci},this.value)">${pressSel}</select>
        ${col.press==='custom' ? `
          <span class="count-wrap">
            <input class="timing-inp" style="width:44px" type="number" min="2" max="20" value="${col.count}"
              oninput="setCount(${ci},this)">
            <span class="timing-unit">${T('press_times')}</span>
          </span>` : ''}
        ${canDelCol ? `<button class="col-del" title="${A(T('del_press'))}" onclick="delColumn(${ci})">✕</button>` : ''}
      </div>
      <div class="act-list">
        ${col.actions.map((a,ai)=>renderActCard(ci,ai)).join('')}
      </div>
      ${renderLedBlock(ci)}
    </div>
      ${canAddAct(edit, ci)
        ? `<button class="add-circle" title="${A(T('add_action'))}" onclick="addAction(${ci})">＋</button>`
        : `<div class="add-wrap">
             <button class="add-circle at-limit" title="${A(addActWhy(edit, ci))}"
                     onclick="addAction(${ci})">＋</button>
             <div class="add-why">${H(addActWhy(edit, ci))}</div>
           </div>`}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   「這一步到下一步實際會隔多久」
   ──────────────────────────────────────────────────────────────
   為什麼要顯示：使用者問「延遲時間準不準」。答案是【那個毫秒數本身是
   準的，但它不是兩步之間的實際間隔】——

     實際間隔 = 這個動作自己的耗時 + 你設的延遲 (+ 從控的總線往返)

   動作自己的耗時是韌體裡的固定 delay()，不可設定：
     組合鍵/功能鍵 55ms（5+5+30+15）、媒體鍵 45ms（30+15）、
     字串每字元 4ms。
   所以把延遲設成 0 並【不是】沒有間隔 —— 組合鍵仍有 55ms。
   而 KEY2 以上的按鍵每個動作還要多一次總線往返（實測約 65ms）。

   把算出來的數字直接寫在欄位下面，比讓使用者自己去猜有用。
   ══════════════════════════════════════════════════════════════ */
function actSelfMs(a){
  if(a.type===ACT_STR)   return (a.str||'').length * ACT_OVERHEAD.perChar;
  if(a.type===ACT_KEY)   return isMediaKeyUsage(a.key) ? ACT_OVERHEAD.media
                                                       : ACT_OVERHEAD.combo;
  if(a.type===ACT_COMBO) return ACT_OVERHEAD.combo;
  return 0;                                   /* 關閉 = 什麼都不做 */
}
function gapHint(ci,ai){
  const a = edit[ci].actions[ai];
  const self = actSelfMs(a);
  const dly  = a.delay||0;
  /* 只有從控（位址非 0）才有總線往返 */
  const bus  = (selIdx!==null && devices[selIdx] && devices[selIdx].addr!==0)
             ? BUS_FETCH_MS : 0;
  const total = self + dly + bus;
  return T('gap_hint').replace('%t', total)
                      .replace('%s', self)
                      .replace('%d', dly)
                      .replace('%b', bus ? T('gap_bus').replace('%b', bus) : '');
}

function renderActCard(ci,ai){
  const sl=edit[ci].actions[ai], t=sl.type;
  const canDel = edit[ci].actions.length>1;
  const optGroup = FKEY_GROUPS().map(g=>`
    <optgroup label="${H(g.g)}">
      ${g.items.map(it=>`<option value="${it.v}"${t===ACT_KEY&&sl.key===it.v?' selected':''}>${H(it.l)}</option>`).join('')}
    </optgroup>`).join('');
  return `
    <div class="act-card">
      <div class="act-card-head">
        <span class="act-num">${T('step')} ${ai+1}</span>
        ${canDel ? `<button class="act-del" title="${A(T('del_action'))}" onclick="delAction(${ci},${ai})">✕</button>` : ''}
      </div>
      <div class="mode-row">
        <span class="row-lbl">${T('action_lbl')}</span>
        <select class="f-select" onchange="setActMode(${ci},${ai},parseInt(this.value))">
          <option value="${ACT_NONE}" ${t===ACT_NONE?'selected':''}>${T('act_none')}</option>
          <option value="${ACT_STR}"  ${t===ACT_STR ?'selected':''}>${T('act_str')}</option>
          <option value="${ACT_KEY}"  ${t===ACT_KEY ?'selected':''}>${T('act_key')}</option>
          <option value="${ACT_COMBO}"${t===ACT_COMBO?'selected':''}>${T('act_combo')}</option>
        </select>
      </div>
      ${t===ACT_NONE ? `<div class="off-hint">${T('off_hint')}</div>`
      : t===ACT_STR ? `
        <div class="str-section">
          <div class="str-label">${T('str_lbl')} ${T('str_max')}</div>
          <textarea class="f-textarea" maxlength="${FW_STR_MAX}" placeholder="${A(T('str_ph'))}"
            oninput="setStr(${ci},${ai},this)"
          >${H(sl.str||'')}</textarea>
          <div class="char-hint">${strBytes(sl.str)}/${FW_STR_MAX} bytes</div>
        </div>`
      : t===ACT_KEY ? `
        <div class="mode-row">
          <span class="row-lbl">${T('act_key')}</span>
          <select class="f-select" onchange="setFKey(${ci},${ai},this)">
            <option value="0"${!sl.key?' selected':''}>${T('sel_ph')}</option>
            ${optGroup}
          </select>
        </div>`
      : t===ACT_COMBO ? `
        <div class="str-label">${T('add_combo')}</div>
        <div class="combo-field">
          <div class="combo-chips">${fmtChips(sl.mod,sl.key,sl.ext)||`<span class="no-combo">${T('combo_none')}</span>`}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
          <button class="btn btn-sm" onclick="openModal(${ci},${ai})">＋ ${T('set_combo')}</button>
          ${(sl.mod||sl.key||actKeys(sl).length)?`<button class="btn btn-sm" onclick="clrCombo(${ci},${ai})">${T('clr_combo')}</button>`:''}
        </div>`
      : ''}
      <div class="delay-row">
        <span class="delay-lbl">⏱ ${T('delay_after')}</span>
        <input class="timing-inp" type="number" min="0" max="${FW_DELAY_MAX}" step="50" value="${sl.delay||0}"
          oninput="setDelay(${ci},${ai},this)">
        <span class="timing-unit">ms</span>
      </div>
      ${ai < edit[ci].actions.length-1
        ? `<div class="char-hint" style="margin-top:2px">${H(gapHint(ci,ai))}</div>` : ''}
    </div>`;
}

/* ── mutations ── */
function setPress(ci,press){
  // 護鎖：拒絕與其他欄重複的按法（custom 可重複）
  if(press!=='custom' && edit.some((c,i)=>i!==ci && c.press===press)){
    renderCfg(); return;
  }
  /* ★ 切換按法時，若目前的時間還是「舊按法的預設值」就跟著換成新按法的預設。
   * 使用者自己調過的值不動 —— 只換沒被碰過的預設。
   * 少了這段：從「按一下(200)」切到「自訂按壓次數」會留著 200ms，
   * 對連按 3 下太短，很容易被判成兩次獨立的單擊。 */
  edit[ci].press=press;
  if(press==='custom' && (!edit[ci].count || edit[ci].count<2)) edit[ci].count=3;
  renderCfg();
}
function setActMode(ci,ai,mode){
  const d=edit[ci].actions[ai].delay||0;
  edit[ci].actions[ai]={type:mode,str:'',key:0,mod:0,delay:d};
  renderCfg();
}
function addColumn(){
  /* ★ 上限要在函式裡再擋一次，不能只靠按鈕 disabled ——
   * 舊的 localStorage 資料、鍵盤操作、或以後別的呼叫點都可能繞過 UI。 */
  if(!canAddCol(edit)){ toast(addColWhy(edit),'err'); return; }
  // 護鎖：自動挑選尚未使用的按法，全用完則加「自訂」
  const used=edit.map(c=>c.press);
  const avail=['single','double','long'].find(p=>!used.includes(p)) || 'custom';
  edit.push(newCol(avail)); renderCfg();
}
function delColumn(ci){ if(edit.length>1){ edit.splice(ci,1); renderCfg(); } }
function addAction(ci){
  if(!canAddAct(edit,ci)){ toast(addActWhy(edit,ci),'err'); return; }
  edit[ci].actions.push(newAction()); renderCfg();
}
function delAction(ci,ai){ if(edit[ci].actions.length>1){ edit[ci].actions.splice(ai,1); renderCfg(); } }
function clrCombo(ci,ai){
  const a=edit[ci].actions[ai];
  a.mod=0; a.key=0; a.ext=[];      /* ★ ext 也要清 —— 少了它「清除」只清掉第 1 個主鍵 */
  renderCfg();
}

/* ════════════════════════════════════════════════════════════
   Apply / Reset
   ════════════════════════════════════════════════════════════ */
let _afTimer=null;
/* 置中大提示；ok=true 綠框✓、false 紅框⚠（斷線/未連接也用同樣風格） */
function flashBanner(msg, ok){
  const el=document.getElementById('applyFlash');
  const box=el.querySelector('.box');
  const chk=el.querySelector('.chk');
  document.getElementById('applyMsg').textContent=msg;
  box.style.borderColor = ok ? '#22c55e' : '#e5484d';
  chk.style.background  = ok ? '#22c55e' : '#e5484d';
  chk.textContent       = ok ? '✓' : '⚠';
  el.classList.add('show');
  clearTimeout(_afTimer);
  _afTimer=setTimeout(()=>el.classList.remove('show'), ok?1300:1800);
}

/* ★ 判斷一份設定是不是「其實什麼都不會做」。
 * mkCfg() 的預設值是「輸入空字串」——送到裝置完全合法、也會回報成功，
 * 但按下去什麼都不會發生。這正是「KEY2 從來沒有效過」的原因：
 * 每台裝置各有自己的設定，在 KEY1 分頁改的內容不會跟著切到 KEY2，
 * 所以按 KEY2 的套用其實是把「空設定」灌進去。 */
function isCfgEmpty(cfg){
  return !(cfg||[]).some(c => (c.actions||[]).some(a => {
    if(a.type===ACT_STR)   return (a.str||'').length>0;
    if(a.type===ACT_KEY)   return !!a.key;
    /* ★ 組合鍵只有修飾鍵也算有內容（例如單按 Win 開開始選單、Ctrl+Shift 切輸入法）。
     * 原本只看 a.key —— 純修飾鍵的設定會被誤判成「空白」，套用直接被擋下，
     * 韌體端的 macroCombo 其實支援（`!k && !mod` 才略過）。 */
    if(a.type===ACT_COMBO) return !!(a.key || a.mod || actKeys(a).length);
    return false;
  }));
}

async function doApply(){
  if(selIdx===null){toast(T('save_err')+'no device','err');return;}
  if(!hid){ flashBanner(isDemo ? T('no_hw_demo') : T('no_hw'), false); return; }

  /* ★ 一顆按鈕、寫進所有裝置，但【每台寫的是它自己的設定】。
   * 不是把目前畫面的內容複製到每一台 —— 那樣停在 KEY1 分頁按套用
   * 就會蓋掉 KEY2 的設定（反之亦然）。
   * 先把畫面上的編輯內容存回目前這台，再逐台寫入各自的設定。 */
  /* 套用期間停掉掃描（含已排程的），避免與轉發搶主控。
   * ★ 一定要用 try/finally —— 中間有 `if(!todo.length) return;` 這種
   * 提早離開的路徑，漏清旗標的話掃描會永遠停擺。 */
  applying = true;
  clearTimeout(scanSched);
  try{

  /* ★ 一定要【同時】寫回 cfgStore。cfgStore 才是重建清單時的唯一來源，
   * 只改 devices[selIdx].cfg 的話，下一次掃描或重新插拔重建清單時，
   * 這台就會退回 cfgStore 裡的舊值 —— 症狀就是使用者回報的
   * 「KEY1 重新插拔，KEY2 的設定內容就清空了」。
   * （selectDev 切換分頁時是成對寫的，這裡漏了一半。） */
  {
    const c = cloneCfg(edit);
    devices[selIdx].cfg = c;
    cfgStore[devices[selIdx].addr] = c;
    saveStore();
  }

  /* ★ 這裡原本會【靜默】把目前分頁的設定複製到所有空設定的裝置。
   * 那造成「KEY2 的設定莫名變成 KEY1 的內容」—— 使用者根本沒要求複製。
   * 現在改成：空設定的裝置直接跳過，並在結束時明確告知是哪幾台，
   * 要複製請自己切到那台去設定。網頁不做使用者沒要求的事。 */

  /* 未偵測到、或還沒設定過的裝置都排除在外，並記下原因好告知使用者 */
  /* ★ 這裡原本有 `&& !d.lost` —— 只要掃描沒抓到就【完全跳過】那台，
   * 連試都不試，而「已跳過」只是 1.5 秒後的一個 toast，非常容易錯過。
   * 結果就是：按套用 → 只寫了主控 → 按 KEY2 沒反應（它根本沒收到設定），
   * 而且再按幾次套用也永遠不會寫進去。
   *
   * 「未偵測到」是網頁根據掃描結果做的【推測】，不是事實 ——
   * 掃描是間歇性的，而轉發本身有 3 次重試。所以一律嘗試，
   * 讓真正的結果來決定；成功就把「未偵測到」的標記清掉。 */
  const todo    = devices.filter(d => d.cfg && !isCfgEmpty(d.cfg));
  const skipped = devices.filter(d => !todo.includes(d))
                         .map(d => d.name + '（'+T('not_set')+'）');
  if(!todo.length){ flashBanner(T('cfg_empty'), false); return; }

  /* ★ 容量檢查：韌體的 saveConfig() 是「寫不下就從那裡開始停」，
   * 而且不會回報 —— 使用者會以為全部都在，其實後面幾個動作根本沒存進去。
   * 所以在送出之前先算，並且明確指出是哪一台的哪一欄哪個動作放不下。 */
  for(const d of todo){
    const ov = cfgOverflow(d.cfg);
    if(ov){
      /* ★ ov.act === 0 表示「連這一欄的欄頭都放不下」，不是某個動作。
       * 原本一律套 too_big 那句「第 %c 欄的第 %a 個動作開始放不下」，
       * act 是 0 時會印出「第 4 欄的第 - 個動作」這種髒字。
       * 欄頭從 9 降到 7 bytes 之後這條路徑更容易走到（_test10 抓到）。
       * 兩種情形用兩句不同的話。 */
      flashBanner((ov.act ? T('too_big') : T('too_big_col'))
        .replace('%s', d.name)
        .replace('%c', String(ov.col))
        .replace('%a', String(ov.act))
        .replace('%u', String(cfgBytes(d.cfg)))
        .replace('%m', String(FW_CFG_LIMIT)), false);
      return;                       /* 一個字都不送 —— 半套的設定比不套用更難查 */
    }
  }

  // 中文無法由 HID 直接打出 → 提醒使用者哪些字會被略過
  const bad=[];
  todo.forEach(d=>d.cfg.forEach(c=>c.actions.forEach(a=>{
    if(a.type===ACT_STR && a.str && /[^\x20-\x7E\n\t]/.test(a.str)) bad.push(a.str);
  })));

  const failed=[];
  for(const d of todo){
    try{
      await writeDev(d.addr, d.cfg, devices.indexOf(d) + 1);
      d.lost = false;              /* 寫成功了 → 它顯然在線上，清掉推測性的標記 */
    }
    catch(e){ failed.push(d.name); d.lost = true; }   /* 失敗的才標記起來 */
  }
  renderDevList();

  /* ★ 說出是哪一台失敗，而不是只報「有 N 包沒送到」——
   * 使用者需要知道要去檢查哪一顆的接線。 */
  if(failed.length){
    /* ★ 兩種失敗都要收：轉發給從控的、以及寫主控自己的。
     * 原本只篩「轉發失敗」，主控本機寫入失敗的那幾行會被漏掉。 */
    applyLog = scanLog.filter(l=>l.indexOf(APPLY_FAIL)>=0).slice(-6);
    flashBanner(T('fwd_fail_dev').replace('%s', failed.join('、')), false);
  }else{
    /* ★ 明確說出灌了哪幾台 —— 原本只寫「已套用設定」，
     * 使用者看不出到底套用了什麼、套用到哪裡。 */
    /* 使用者已套用 → 兩個提示都收掉（識別碼也在剛剛的封包裡寫進去了） */
    boardChanged = false;
    boardUnset   = false;
    applyLog     = [];          /* 成功了 → 清掉上次的失敗記錄 */
    /* ★ 記下「按鍵裡現在是什麼」的快照 —— isDirty() 靠它判斷之後的修改。
     * 只在【全部成功】的分支記；失敗時按鍵裡的內容不確定，
     * 就該繼續顯示「還沒套用」，不要假裝已經同步。 */
    todo.forEach(d=>{ appliedNow[d.addr]  = true;
                      appliedSnap[d.addr] = JSON.stringify(cloneCfg(d.cfg)); });
    flashBanner(T('applied_list').replace('%s', todo.map(d=>d.name).join('、')), true);
    if(skipped.length) setTimeout(()=>toast(T('skipped_list').replace('%s', skipped.join('、')),'err'), 1500);
    if(bad.length)     setTimeout(()=>toast(T('cjk_warn'),'err'), 2600);
  }
  }finally{
    applying = false;
    /* ★ 一定要重繪設定面板。提示（noticeHtml）與逐包失敗記錄（applyLogHtml）
     * 都在 renderCfg 的模板裡 —— 原本只呼叫 renderDevList()，所以要等
     * 600ms 後那次掃描完成、rebuildDevices 順便重繪，訊息才會出現。
     * 使用者按完套用當下看不到任何東西，那等於沒有回饋。 */
    if(selIdx !== null) renderCfg();
    /* 套用完再掃一次：確認清單與硬體一致（也讓「未偵測」旗標更新） */
    scheduleScan(600, true);
  }
}

function doReset(){
  if(!confirm(T('reset_ask')))return;
  edit=mkCfg(); renderCfg();
}

/* ════════════════════════════════════════════════════════════
   Combo modal
   ════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   組合鍵：任意主鍵組合（W+A+S）
   ──────────────────────────────────────────────────────────────
   原本一個動作只能存「修飾鍵 + 一個主鍵」，所以 W+A+S 設不出來。

   資料模型刻意【只加不改】：
     a.key = 第 1 個主鍵（語意完全不變）
     a.ext = 第 2 個之後的主鍵（陣列，可以不存在）
   這樣所有既有的程式碼（isCfgEmpty、診斷記錄、舊的 localStorage 設定）
   都照常運作，舊設定讀進來 ext 是 undefined＝沒有額外主鍵。

   封包也不用改格式：ACT_COMBO 用不到字串欄位，就把 ext 放進
   p[12]（長度）+ p[13..]（usage 位元組）。韌體的 applyCfgPacket 本來
   就會把這段複製進 ac->str，macroCombo 再依序按下去。

   ⚠ 上限 6 個 —— HID 鍵盤報告只有 6 個鍵位（HIDKey[2..7]）。
   ⚠ ext 的位元組不可以是 0（韌體用 0 當結尾）。usage 有效範圍
     0x04~0x65 本來就不含 0，所以安全，但新增鍵時要記得這件事。
   ══════════════════════════════════════════════════════════════ */
const KB_MAX_KEYS = 6;
let mCtx=null, cmb={mod:0,keys:[]};

/* 一個動作目前選了哪些主鍵（第 1 個 + 額外的），統一從這裡取 */
function actKeys(sl){
  const ks = sl.key ? [sl.key] : [];
  return ks.concat(Array.isArray(sl.ext) ? sl.ext : []);
}

function openModal(ci,ai){
  mCtx={ci,ai};
  const sl=edit[ci].actions[ai];
  cmb={mod:sl.mod||0, keys:actKeys(sl)};
  buildKB(); highlightKB(); prevCombo();
  // Apply current lang strings
  document.getElementById('m-title').textContent=T('m_title');
  document.getElementById('m-clr').textContent=T('m_clr');
  document.getElementById('m-can').textContent=T('m_can');
  document.getElementById('m-ok').textContent=T('m_ok');
  document.getElementById('m-hint').textContent=T('m_hint');
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
function bgClick(e){ if(e.target===document.getElementById('overlay'))closeModal(); }

function clearCombo(){ cmb={mod:0,keys:[]}; highlightKB(); prevCombo(); }

function confirmCombo(){
  if(mCtx){
    const a=edit[mCtx.ci].actions[mCtx.ai];
    a.mod=cmb.mod;
    a.key=cmb.keys[0]||0;              /* 第 1 個主鍵（語意不變）*/
    a.ext=cmb.keys.slice(1);           /* 第 2 個之後 */
    a.type=ACT_COMBO;
    closeModal(); renderCfg();
  }
}

function buildKB(){
  document.getElementById('kb').innerHTML=KB_ROWS.map(row=>{
    const cells=row.map(([lbl,code,w,isMod,modBit])=>{
      if(!lbl){return `<div style="width:${kpx(w)}px;flex-shrink:0"></div>`;}
      const px=`width:${kpx(w)}px;min-width:${kpx(w)}px`;
      /* ★ 滑過顯示完整名稱 —— 104 鍵圖上有兩組「7」「8」「9」「0」「.」
       * （主鍵盤與數字鍵台），標籤一樣但 usage 不同。tooltip 用 HID 表
       * 的正式名稱（'Num 7' vs '7'），使用者才分得出點到哪一個。 */
      const tip = isMod ? lbl : (HID[code] || ('0x'+code.toString(16)));
      return isMod
        ? `<div class="kb-key" style="${px}" title="${A(tip)}" data-mod="${modBit}" onclick="tMod(${modBit})">${H(lbl)}</div>`
        : `<div class="kb-key" style="${px}" title="${A(tip)}" data-code="${code}" onclick="tKey(${code})">${H(lbl)}</div>`;
    }).join('');
    return `<div class="kb-row">${cells}</div>`;
  }).join('');
}

function tMod(b){ cmb.mod^=b; highlightKB(); prevCombo(); }
/* 主鍵改成多選（原本是單選：`cmb.key = (cmb.key===c) ? 0 : c`）。
 * 到達 6 鍵上限時不再加入，並用 toast 說明原因 —— 靜靜地忽略點擊
 * 會讓人以為那顆鍵壞了。 */
function tKey(c){
  const i = cmb.keys.indexOf(c);
  if(i >= 0){ cmb.keys.splice(i,1); }
  else if(cmb.keys.length >= KB_MAX_KEYS){
    toast(T('key_max').replace('%d', KB_MAX_KEYS), 'err'); return;
  }
  else cmb.keys.push(c);
  highlightKB(); prevCombo();
}

function highlightKB(){
  document.querySelectorAll('#kb .kb-key').forEach(el=>{
    el.classList.remove('sel','msel');
    if(el.dataset.mod){ if(cmb.mod&parseInt(el.dataset.mod))el.classList.add('msel'); }
    else if(el.dataset.code){
      if(cmb.keys.indexOf(parseInt(el.dataset.code))>=0) el.classList.add('sel');
    }
  });
}

function prevCombo(){
  const el=document.getElementById('comboPrev');
  const s=fmtChips(cmb.mod,cmb.keys[0]||0,cmb.keys.slice(1));
  el.innerHTML=s||`<span id="m-hint" style="color:var(--muted);font-size:12px;">${T('m_hint')}</span>`;
}

/* mod + 主鍵們 → 一排 chip。ext 可以省略（舊的呼叫點都只有兩個參數）。 */
function fmtChips(mod,key,ext){
  const parts=[];
  MODS.forEach(([b,n])=>{ if(mod&b)parts.push(n); });
  const keyName = k => HID[k] || ('0x'+k.toString(16));
  if(key) parts.push(keyName(key));
  (Array.isArray(ext)?ext:[]).forEach(k=>{ if(k) parts.push(keyName(k)); });
  if(!parts.length)return '';
  return parts.map((p,i)=>
    `<span class="chip">${H(p)}</span>`+(i<parts.length-1?'<span class="chip-plus">+</span>':'')
  ).join('');
}

/* ════════════════════════════════════════════════════════════
   Theme / Lang / i18n refresh
   ════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════
   深淺色主題：預設跟隨【瀏覽器】，使用者按過按鈕就以他的選擇為準
   ──────────────────────────────────────────────────────────
   ・一開始讀 prefers-color-scheme —— 這個媒體查詢回報的是【瀏覽器】
     目前的色彩偏好，不是作業系統的。Chrome / Edge 可以在
     「設定 → 外觀 → 主題」把它覆寫成淺色或深色；沒有覆寫時
     瀏覽器才會去跟隨系統。所以「跟隨瀏覽器」就是用這個訊號。
   ・瀏覽器偏好中途改變（切換主題、或系統日落自動切換）也會跟著換 ——
     但只有在使用者這次沒有手動按過切換的情況下才跟，否則會蓋掉他的選擇
   ・手動選擇記在 localStorage，下次開啟仍然沿用
   ══════════════════════════════════════════════════════════ */
const THEME_KEY = 'keyatolan_theme';

/* ══════════════════════════════════════════════════════════════════
   ★★ 為什麼不能「跟隨瀏覽器而不是系統」★★

   使用者要的是「改瀏覽器主題，網頁跟著變」。實測結果是沒有反應，
   而那不是這個網頁的 bug —— 是網頁平台根本沒有這個訊號：

   ・網頁唯一能讀到的主題偏好就是 CSS 的 prefers-color-scheme。
   ・桌機版 Chrome／Edge 的 prefers-color-scheme【只反映作業系統】，
     不反映瀏覽器「外觀→主題」那個設定（Chrome 上有人在 2025/12 回報過，
     至今未定調是 bug 還是設計）。
   ・沒有任何 API 能讀到「瀏覽器自己的主題」。

   所以「跟隨瀏覽器」做不到。硬做只會變成猜，而且會猜錯。

   改成【明確的三段控制】—— 使用者要的其實是「不要被系統綁死」：
       自動（跟隨系統） → 淺色 → 深色 → 自動 …
   按鈕會直接顯示目前是哪一段，選擇記在 localStorage。
   選「自動」時系統改深淺會即時跟著換；選了淺／深就固定不動。
   ══════════════════════════════════════════════════════════════════ */

/* 系統目前偏好深色嗎。★ 名稱從 browserDark 改回 systemDark ——
 * 之前叫 browserDark 是我寫錯了，那個名字會讓人以為它讀的是瀏覽器設定。 */
const systemDark = () => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);

/* 'auto' | 'light' | 'dark' */
let themeMode = 'auto';
let dark = true;              // 目前實際是不是深色
/* ★ 系統偏好要【快取】而不是每次重新查詢：
 * matchMedia 的 change 事件帶著 e.matches，那是最權威的值；
 * 在事件裡回頭重新查 matchMedia 不見得已經更新（測試環境就會不同步）。 */
let sysDark = false;

function applyTheme(){
  dark = (themeMode === 'auto') ? sysDark : (themeMode === 'dark');
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const b = document.getElementById('themeBtn');
  if(b){
    b.textContent = themeMode === 'auto' ? '🅰' : (themeMode === 'dark' ? '🌙' : '☀️');
    b.title = T('theme_' + themeMode);
  }
}

function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  themeMode = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'auto';
  sysDark = systemDark();
  applyTheme();
  /* 系統偏好變更 → 只在「自動」時跟著換 */
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = e => {
      sysDark = (e && typeof e.matches === 'boolean') ? e.matches : systemDark();
      if(themeMode === 'auto') applyTheme();
    };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }
}

/* 自動 → 淺色 → 深色 → 自動 */
function toggleTheme(){
  themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto');
  if(themeMode === 'auto') sysDark = systemDark();   /* 回到自動 → 重新對齊系統 */
  try{ localStorage.setItem(THEME_KEY, themeMode); }catch(e){}
  applyTheme();
  toast(T('theme_' + themeMode), 'ok');
}

initTheme();

function toggleLang(){
  lang=lang==='zh'?'en':'zh';
  document.getElementById('langBtn').textContent=lang==='zh'?'中':'EN';
  document.documentElement.lang=lang==='zh'?'zh-TW':'en';
  refreshUI();
}

function refreshUI(){
  setConn(isConn);
  document.getElementById('lbl-dev').textContent=T('dev_label');
  const scanLbl = document.getElementById('lbl-scan');
  if(scanLbl) scanLbl.textContent=T('dev_scan');   /* 只剩一顆按鈕 → 用掃描的文案 */
  const akLbl = document.getElementById('lbl-addkey');
  if(akLbl) akLbl.textContent=T('addkey');
  const akTitle = document.getElementById('addKeyBtn');
  if(akTitle) akTitle.title=T('a_title');
  const aTitle = document.getElementById('a-title');
  if(aTitle) aTitle.textContent=T('a_title');
  /* 指派視窗開著的時候切語言 → 內容要一起換（它是動態產生的） */
  const asgOv = document.getElementById('asgOverlay');
  if(asgOv && asgOv.className.indexOf('open')>=0) renderAssign();
  /* 顏色挑選器是內嵌的，renderCfg() 就會把它一起重繪，不必特別處理。 */
  const wStory = document.getElementById('w-story');
  if (wStory) wStory.textContent = T('w_story');
  document.getElementById('w-p').innerHTML=T('w_desc').replace('\n','<br>');
  const wBtn = document.getElementById('w-btn');
  if (wBtn) wBtn.textContent = T('connect');
  // 標題列副標與各按鈕的 tooltip（切換語言時一併更新）
  const setTitle=(id,k)=>{const el=document.getElementById(id); if(el) el.title=T(k);};
  const hdrSub=document.getElementById('hdrSub'); if(hdrSub) hdrSub.textContent=T('hdr_sub');
  setTitle('connBtn','conn_hint');
  setTitle('themeBtn','theme_title');
  setTitle('langBtn','lang_title');
  setTitle('w-connect-btn','demo_hint');
  renderDevList();
  if(selIdx!==null) renderCfg();
}

/* ════════════════════════════════════════════════════════════
   Long-press  (hold 3 s)
   • 未連線 → 示範模式
   • 已連線 → 中斷連線
   ════════════════════════════════════════════════════════════ */
let _lpTimer = null, _lpFired = false;

function lpStart(e) {
  if (e) e.preventDefault();
  _lpFired = false;
  const btn = document.getElementById('connBtn');
  btn.classList.add('btn-lp');
  _lpTimer = setTimeout(() => {
    _lpFired = true;
    btn.classList.remove('btn-lp');
    if (isConn) { deactivate(); }
    else        { activateDemo(); }
  }, 3000);
}

function lpCancel() {
  clearTimeout(_lpTimer); _lpTimer = null;
  document.getElementById('connBtn').classList.remove('btn-lp');
}

function deactivate() {
  if (hid) {
    hid.removeEventListener('inputreport', onInput);
    hid.close().catch(()=>{});
    hid = null;
  }
  devices = []; selIdx = null; edit = []; isDemo = false;
  setConn(false);
  renderDevList();
  document.getElementById('cfg').style.display     = 'none';
  document.getElementById('welcome').style.display = '';
  toast(T('toast_disc'), 'ok');
}

function activateDemo() {
  // 預設每顆鍵只有一個「按一下」欄，內含依序執行的巨集動作（含 delay）
  devices = [
    {
      addr: 0x00, name: '按鍵1', serial: 'AB:CD:EF:01:23:45',
      cfg: [
        { press:'single', count:1, actions:[
          { type:ACT_STR,   str:'Hello, KEY都蘭!', key:0,    mod:0,    delay:100 },
          { type:ACT_COMBO, str:'',               key:0x3B, mod:0,    delay:100 }, // F2
          { type:ACT_KEY,   str:'',               key:0x4C, mod:0,    delay:0   }, // Delete
        ]},
      ]
    },
    {
      addr: 0x10, name: '按鍵2', serial: 'AB:CD:EF:01:23:46',
      cfg: [
        { press:'single', count:1, actions:[
          { type:ACT_STR, str:'test@example.com', key:0, mod:0, delay:0 },
        ]},
      ]
    },
    {
      addr: 0x18, name: '按鍵3', serial: 'AB:CD:EF:01:23:47',
      cfg: [
        { press:'single', count:1, actions:[
          { type:ACT_KEY, str:'', key:0xCD, mod:0, delay:0 }, // 播放/暫停
        ]},
      ]
    },
  ];
  isDemo = true;
  setConn(true);
  renderDevList();
  selectDev(0);
  toast(T('toast_demo'), 'ok');
}

/* ════════════════════════════════════════════════════════════
   Toast / utilities
   ════════════════════════════════════════════════════════════ */
let _tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast show ${type}`;
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),3000);
}

function H(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function A(s)  { return H(s).replace(/"/g,'&quot;'); }
